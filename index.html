<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimfall">
<meta name="theme-color" content="#0b0908">
<title>Grimfall — Dominion of the Old World</title>
<style>
:root{
  --bg:#0b0908;--panel:#16110e;--panel2:#211913;--line:#3b2c1d;--line2:#5a4128;
  --gold:#d4a84b;--gold2:#f2d27e;--bronze:#9a6532;--text:#ecdfc6;--muted:#9b8a70;
  --red:#d0493a;--green:#86b84f;--blue:#6b9bc7;--purple:#a65bd0;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% -10%,#2a1c12 0%,#0b0908 55%) fixed;min-height:100vh;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:var(--serif);color:var(--gold);margin:0 0 8px;font-weight:700;letter-spacing:.04em}
h2{font-size:17px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
h3{font-size:15px}
h4{font-size:13px;color:var(--gold2);margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.neg{color:var(--red)}.pos{color:var(--green)}
b.up{color:var(--green)}

/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(var(--safe-t) + 6px) 8px 6px;background:linear-gradient(#140f0b,#0d0a08);border-bottom:1px solid var(--line2);box-shadow:0 6px 18px #000c}
.hrow{display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto 6px}
.crest{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:radial-gradient(#3a2a1a,#1a120c);border:1px solid var(--gold);box-shadow:0 0 10px #d4a84b44}
.vn{flex:1;min-width:0}
.vn .t{font-family:var(--serif);color:var(--gold2);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vn .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:#1d1510;border:1px solid var(--line2);color:var(--gold);border-radius:9px;height:34px;min-width:34px;padding:0 9px;font-size:14px;font-weight:700;font-family:inherit}
.hbtn.on{background:#3a2814;border-color:var(--gold2);color:var(--gold2)}
.resbar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:900px;margin:0 auto}
.rc{background:#1a130e;border:1px solid var(--line);border-radius:8px;padding:4px 5px 4px;min-width:0;cursor:pointer}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:2px}
.rtop span{font-size:13px}
.rtop b{font-variant-numeric:tabular-nums;font-size:13px}
.rbar{height:4px;background:#000;border-radius:3px;overflow:hidden;margin:3px 0 2px}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bronze),var(--gold));transition:width .5s}
.rbar i.full{background:linear-gradient(90deg,#8a2a1e,var(--red))}
.rrate{font-size:10.5px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rrate.bad{color:var(--red)}
.rsub{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{max-width:900px;margin:6px auto 0;background:linear-gradient(90deg,#4a1510,#2a0d0a);border:1px solid var(--red);color:#ffd9cf;border-radius:8px;padding:6px 10px;font-size:12.5px;display:flex;align-items:center;gap:8px;animation:throb 1.4s infinite;cursor:pointer}
@keyframes throb{50%{box-shadow:0 0 14px #d0493a99}}

/* Main + nav */
main{padding:150px 10px calc(84px + var(--safe-b));max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:linear-gradient(#120d0a,#0a0706);border-top:1px solid var(--line2);padding:4px 4px calc(4px + var(--safe-b))}
nav button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:10.5px;position:relative;border-radius:10px;font-family:inherit}
nav button .i{font-size:20px;filter:grayscale(.6)}
nav button.on{color:var(--gold2);background:#2a1d12}
nav button.on .i{filter:none}
.hbadge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px;line-height:16px;font-family:sans-serif}
#hDip{position:relative}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px;line-height:16px}

/* Panels */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:inset 0 1px 0 #ffffff0a,0 4px 14px #0007}
.btn{appearance:none;-webkit-appearance:none;background:linear-gradient(#c4923a,#7d5421);color:#1b1006;font-weight:800;border:1px solid #e8c26a;border-radius:10px;padding:10px 14px;min-height:42px;font-size:14px;font-family:inherit;cursor:pointer;text-shadow:0 1px 0 #f3d38a66}
.btn:active{transform:translateY(1px)}
.btn[disabled]{filter:grayscale(1);opacity:.45}
.btn.full{width:100%;margin-top:8px}
.btn.ghost{background:#1d1510;color:var(--gold);border-color:var(--line2);text-shadow:none}
.btn.ghost.on{border-color:var(--gold2);color:var(--gold2);background:#2e2014}
.btn.red{background:linear-gradient(#b83a2c,#6d1d15);border-color:#e66a5a;color:#fff;text-shadow:none}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.costs{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{background:#0f0b08;border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:12.5px;font-variant-numeric:tabular-nums}
.chip.lack{border-color:var(--red);color:#ff9c8f}
.meta{font-size:12.5px;color:var(--muted)}
.eff{display:flex;flex-direction:column;gap:2px;font-size:13px;margin:4px 0}
.note{font-size:12.5px;background:#0f0b08;border:1px dashed var(--line2);border-radius:8px;padding:8px;color:var(--muted)}
.note.bad{border-color:var(--red);color:#ffb3a8}
.note.good{border-color:var(--green);color:#cfe8b5}
.prog{height:8px;background:#000;border-radius:5px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bronze),var(--gold2))}
.prog.red i{background:linear-gradient(90deg,#7a1e15,var(--red))}
.qitem{display:flex;align-items:center;gap:10px}
.qicon{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#0f0b08;border:1px solid var(--line);border-radius:10px;flex-shrink:0}
.cd{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:700}
.st{display:inline-block;font-size:10.5px;font-weight:800;border-radius:8px;padding:1px 7px;border:1px solid;vertical-align:middle;letter-spacing:.03em}
.st.war{color:#ff9c8f;border-color:var(--red);background:#2a0e0a}
.st.neutral{color:var(--muted);border-color:var(--line2);background:#16110d}
.st.allied{color:#cfe8b5;border-color:var(--green);background:#14200d}
.relbar{position:relative;height:6px;border-radius:4px;background:linear-gradient(90deg,#5a1a12,#2a2018 50%,#1f3a14);margin-top:5px}
.relbar i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;background:var(--gold2);box-shadow:0 0 6px #000}

/* Village */
.hero{display:flex;gap:12px;align-items:center}
.hero .big{font-size:40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stats.s3{grid-template-columns:repeat(3,1fr)}
.stat{background:#0f0b08;border:1px solid var(--line);border-radius:8px;padding:6px 3px;text-align:center}
.stat b{display:block;color:var(--gold2);font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fgrid.f4{grid-template-columns:repeat(4,1fr);gap:6px}.fgrid.f4 .tn{display:none}.fgrid.f4 .tile{padding-left:2px;padding-right:2px}
.techbr{border:1px solid var(--line2);border-radius:12px;padding:8px;margin-bottom:10px}.techhd{font-weight:700;color:var(--gold);margin-bottom:4px}
.technode{display:flex;gap:8px;padding:8px 4px;position:relative;border-top:1px solid #ffffff0d}.technode:first-of-type{border-top:0}
.technode .tnic{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid var(--line2);background:#0b0806}
.technode.done .tnic{border-color:var(--green)}.technode.busy .tnic{border-color:var(--gold)}.technode.open .tnic{border-color:var(--gold2)}.technode.lock{opacity:.55}
.fhead{display:flex;align-items:center;gap:6px;font-size:13px;margin:12px 0 6px}.fhead:first-of-type{margin-top:4px}.fhead .sp{flex:1}
@media(min-width:560px){.fgrid{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;border-radius:12px;border:1px solid var(--line);padding:8px 4px 6px;text-align:center;cursor:pointer;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 0 18px #0008}
.tile .ti{font-size:28px;line-height:1}
.tile .tn{font-size:11px;color:var(--text);opacity:.9}
.tile .tp{font-size:10.5px;color:var(--green)}
.tile .lv{position:absolute;top:4px;right:5px;background:#0b0806;border:1px solid var(--gold);color:var(--gold2);font-size:11px;font-weight:800;border-radius:10px;min-width:20px;padding:0 4px;line-height:18px}
.tile .ok{position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.tile.timber{background:linear-gradient(160deg,#1f2a16,#121009)}
.tile.clay{background:linear-gradient(160deg,#3a2215,#120c08)}
.tile.iron{background:linear-gradient(160deg,#252a31,#0f0e0d)}
.tile.crop{background:linear-gradient(160deg,#3b3214,#120f08)}
.tile.bld{background:linear-gradient(160deg,#2a1f15,#100c09)}
.tile.busy{border-color:var(--gold);animation:busy 1.6s infinite}
@keyframes busy{50%{box-shadow:0 0 14px #d4a84b88,inset 0 0 18px #0008}}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:560px){.bgrid{grid-template-columns:repeat(8,1fr)}}
.bgrid .tile{min-height:78px}

/* Building cards */
.bcard{display:flex;gap:10px}
.bcard .qicon{width:52px;height:52px;font-size:30px}
.bcard .bc{flex:1;min-width:0}
.lvtag{display:inline-block;background:#0b0806;border:1px solid var(--gold);color:var(--gold2);font-size:11px;font-weight:800;border-radius:10px;padding:0 7px;margin-left:4px;vertical-align:middle}
.desc{font-size:12.5px;color:var(--muted);margin:2px 0 4px}

/* Units */
.ugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}
.ugrid div{background:#0f0b08;border:1px solid var(--line);border-radius:7px;padding:4px;text-align:center;font-size:11px;color:var(--muted)}
.ugrid b{display:block;color:var(--text);font-size:14px}
.role{font-size:10.5px;border:1px solid var(--line2);border-radius:8px;padding:1px 6px;color:var(--gold);margin-left:4px}
.tagc{color:var(--text);opacity:.85}.tagi{font-size:12px;opacity:.85}
.simrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #ffffff0d}.simrow .nm{flex:1;min-width:0;font-size:13px}.simrow input{width:72px;text-align:center;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:8px;height:36px;font-size:16px}
.simsel{width:100%;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px;font:inherit;margin-bottom:6px}
.simgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.simgrid label{font-size:12px;color:var(--muted,#a99)}
.odds{font-size:17px;font-weight:700;text-align:center;margin:6px 0}
.stepper{display:flex;align-items:center;gap:6px;margin-top:6px}
.stepper input{width:72px;text-align:center;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:9px;height:40px;font-size:16px;font-weight:700}
.stepper .hbtn{height:40px;min-width:40px;font-size:18px}
.locked{opacity:.55}

/* Map */
.maptools{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#mapBox{position:relative;height:58vh;min-height:300px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#050403;touch-action:none}
#mapCv{display:block;touch-action:none;cursor:grab}
#miniCv{position:absolute;right:6px;bottom:6px;width:160px;height:100px;border:1px solid var(--gold);border-radius:6px;background:#050403;box-shadow:0 4px 14px #000;opacity:.92;touch-action:none}
#mapInfo{position:absolute;left:6px;top:6px;background:#0b0806d9;border:1px solid var(--line2);border-radius:8px;padding:4px 8px;font-size:11.5px;color:var(--text);pointer-events:none;max-width:70%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin:8px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.listrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff0a;cursor:pointer}
.listrow:last-child{border-bottom:0}
.mode{display:flex;gap:6px;margin:8px 0}
.mode button{flex:1}
.mode button.on{background:linear-gradient(#c4923a,#7d5421);color:#1b1006;border-color:#e8c26a}
.sendrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff0a}
.sendrow .nm{flex:1;min-width:0;font-size:13px}
.sendrow input{width:66px;text-align:center;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:8px;height:36px;font-size:16px}
.facrow{padding:10px 0;border-bottom:1px solid #ffffff0a}
.facrow:last-child{border-bottom:0}

/* Reports */
.filters{display:flex;gap:6px;margin-bottom:10px}
.filters button{flex:1}
.rep{border-bottom:1px solid #ffffff0a;padding:9px 0;cursor:pointer}
.rep:last-child{border-bottom:0}
.rep .rh{display:flex;gap:10px;align-items:center}
.rep .ri{font-size:20px;width:30px;text-align:center}
.rep .rt1{flex:1;min-width:0;font-weight:600}
.rep.unread .rt1{color:var(--gold2)}
.rep .when{font-size:11px;color:var(--muted);white-space:nowrap}
.rbody{margin-top:8px;padding:10px;background:#0d0a08;border:1px solid var(--line);border-radius:9px;font-size:13px;cursor:auto}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
table.rt th{color:var(--muted);font-weight:600;text-align:left;border-bottom:1px solid var(--line);padding:3px}
table.rt td{padding:3px;border-bottom:1px solid #ffffff08;font-variant-numeric:tabular-nums}
table.rt td:not(:first-child),table.rt th:not(:first-child){text-align:right}
.bstats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bstats div{background:#16110d;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.bstats b{display:block;font-size:16px;color:var(--gold2)}
.bstats small{color:var(--muted);font-size:10.5px}
.loot{margin-top:8px;color:var(--gold2)}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;background:#000b;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#241a12,#120d0a);border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + var(--safe-b));box-shadow:0 -10px 40px #000;animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line2)}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:-4px auto 10px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.shead .qicon{width:50px;height:50px;font-size:30px}
.shead .x{margin-left:auto}

/* Toast */
#toasts{position:fixed;left:0;right:0;bottom:calc(78px + var(--safe-b));z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:#1d1510ee;border:1px solid var(--gold);color:var(--text);padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px #000;animation:up .2s;max-width:440px;text-align:center}
.toast.bad{border-color:var(--red);background:#2a0e0aee}
.toast.good{border-color:var(--green)}

/* Start screen */
#start{position:fixed;inset:0;z-index:40;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#3a2210 0%,#0b0908 60%);padding:calc(var(--safe-t) + 20px) 14px calc(30px + var(--safe-b))}
.st-in{max-width:760px;margin:0 auto;text-align:center}
.title{font-family:var(--serif);font-size:44px;letter-spacing:.14em;color:var(--gold2);text-shadow:0 0 22px #d4a84b66,0 2px 0 #5a3a12;margin-top:10px}
.subtitle{font-family:var(--serif);color:var(--gold);letter-spacing:.3em;text-transform:uppercase;font-size:12px}
.lore{color:var(--muted);font-size:13.5px;margin:14px auto 18px;max-width:520px;font-style:italic;font-family:var(--serif)}
.facs{display:grid;gap:10px;text-align:left}
@media(min-width:700px){.facs{grid-template-columns:repeat(3,1fr)}}
.fac{background:linear-gradient(180deg,#221911,#120d0a);border:1px solid var(--line2);border-radius:14px;padding:14px;cursor:pointer;transition:transform .15s}
.fac.sel{border-color:var(--gold2);box-shadow:0 0 0 2px #d4a84b55,0 0 24px #d4a84b44;transform:translateY(-2px)}
.fac .fi{font-size:36px}
.fac h3{margin:4px 0 2px;font-size:18px}
.fac .perk{color:var(--green);font-size:12.5px;font-weight:600;margin-bottom:6px}
.fac ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
.namein{margin:18px auto 8px;max-width:360px;text-align:left}
.namein label{font-size:12px;color:var(--muted)}
.namein input{width:100%;margin-top:4px;background:#0b0806;border:1px solid var(--line2);color:var(--text);border-radius:10px;height:44px;padding:0 12px;font-size:16px;font-family:var(--serif)}
.btn.big{font-size:17px;padding:14px 26px;margin-top:8px;font-family:var(--serif);letter-spacing:.06em}
.speeds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.speeds button.on{background:linear-gradient(#c4923a,#7d5421);color:#1b1006;border-color:#e8c26a}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff0a;font-size:13px}
.kv span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.segs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.segs button{flex:1 0 auto;white-space:nowrap}
textarea.code{width:100%;height:130px;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:8px;font:11px/1.3 ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text;word-break:break-all}
.hp{height:7px;background:#000;border-radius:4px;overflow:hidden;margin-top:3px;border:1px solid var(--line)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#8a2a1e,#86b84f)}
.hp.xp i{background:linear-gradient(90deg,#3a5a8a,#7fb6d6)}
.skill{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #ffffff0a}
.skill:last-of-type{border-bottom:0}
.check{display:flex;align-items:center;gap:10px;padding:9px;background:#0f0b08;border:1px solid var(--line2);border-radius:9px;margin-top:8px;font-size:13px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:#d4a84b;flex-shrink:0}
.vn{cursor:pointer}
nav button{font-size:10px}
.scenewrap{margin:0 -4px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#0b0908}
.scene{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}
.scene polygon{stroke:#1a120b;stroke-width:.35;stroke-linejoin:round}
</style>

function findPath(sx, sy, tx, ty, sea) {

  if (PCACHE.has(key)) return PCACHE.get(key);

    const cx = (cur % MAP_W) + MAP_X0, cy = Math.floor(cur / MAP_W) + MAP_Y0;

}

function resolveAiMarch(m) {

  addReport('world', title,
    `${FACS[m.fac].icon} An army from <b>${esc(m.fromName)}</b> (${FACS[m.fac].name}) attacked ${FACS[oldFac].icon} <b>${esc(d.name)}</b> (${FACS[oldFac].name}) at (${d.x}|${d.y}).<br>Offense ${fmt(r.A)} vs defense ${fmt(r.D)} → <b>${outcome}</b>.${fallNote}`, S.time);

/* Watchtower sight: how far each city can see enemy movements */

/* =========================================================
   COMBAT ENGINE
   ========================================================= */
function battle(attackers, defenders, o) {
  const tg = x => x.tag || unitTag(x.key);
  const aSh = {}, dSh = {};
  TAG_KEYS.forEach(k => { aSh[k] = 0; dSh[k] = 0; });
  let aTot = 0, dTot = 0;
  attackers.forEach(a => { const v = a.n * a.att; aTot += v; aSh[tg(a)] += v; });
  defenders.forEach(d => { const v = d.n * (d.di + d.dc) / 2; dTot += v; dSh[tg(d)] += v; });
  TAG_KEYS.forEach(k => { aSh[k] = aTot > 0 ? aSh[k] / aTot : 0; dSh[k] = dTot > 0 ? dSh[k] / dTot : 0; });
  const dLarge = dSh.cav + dSh.monster, aLarge = aSh.cav + aSh.monster;
  const ab = { antilarge: 0.5 * dLarge, cav: 0.25 * dSh.ranged, monster: 0.25 * (dSh.inf + dSh.ranged + dSh.siege) };
  const db = { antilarge: 0.5 * aLarge, ranged: (o.wall || 0) > 0 ? 0.3 : 0 };
  let infA = 0, cavA = 0;
  attackers.forEach(a => { const v = a.n * a.att * (1 + (ab[tg(a)] || 0)); if (a.cls === 'cav') cavA += v; else infA += v; });
  const raw = infA + cavA;
  const luck = o.luck || 1;
  const A = raw * luck * (o.attMult || 1);
  const pi = raw > 0 ? infA / raw : 1, pc = raw > 0 ? cavA / raw : 0;
  let defRaw = 0, defPlain = 0;
  defenders.forEach(d => { const v = d.n * (d.di * pi + d.dc * pc); defPlain += v; defRaw += v * (1 + (db[tg(d)] || 0)); });
  const D = (defRaw + o.baseDef) * o.wallMult * (o.defMult || 1);
  const notes = [];
  ['antilarge', 'cav', 'monster'].forEach(k => { if (aSh[k] > 0.02 && ab[k] > 0.01) notes.push({ side: 'atk', tag: k, pct: ab[k], share: aSh[k] }); });
  ['antilarge', 'ranged'].forEach(k => { if (dSh[k] > 0.02 && db[k] > 0.01) notes.push({ side: 'def', tag: k, pct: db[k], share: dSh[k] }); });
  let attWin, attLoss, defLoss;
  if (A <= 0) { attWin = false; attLoss = 1; defLoss = 0; }
  else if (o.mode === 'attack') {
    attWin = A > D;
    if (attWin) { attLoss = Math.pow(D / A, 1.5); defLoss = 1; }
    else { attLoss = 1; defLoss = Math.pow(A / D, 1.5); }
  } else {
    attWin = A > D;
    const x = Math.pow(Math.min(A, D) / Math.max(A, D), 1.5);
    const winLoss = x / (1 + x), loseLoss = 1 / (1 + x);
    if (attWin) { attLoss = winLoss; defLoss = loseLoss; } else { attLoss = loseLoss; defLoss = winLoss; }
  }
  return { A, D, attWin, attLoss: Math.min(1, attLoss), defLoss: Math.min(1, defLoss), luck, notes, aSh, dSh,
    atkBonus: aTot > 0 ? raw / aTot - 1 : 0, defBonus: defPlain > 0 ? defRaw / defPlain - 1 : 0 };
}
/* side: which side of the battle is the player ('atk' or 'def') */
function matchNoteHTML(r, side) {
  if (!r || !r.notes || !r.notes.length) return '';
  const lines = r.notes.map(n => {
    const mine = n.side === side, t = TAG_INFO[n.tag];
    const vs = n.tag === 'antilarge' ? (n.side === 'atk' ? 'vs the defenders\' cavalry & monsters' : 'vs the attackers\' cavalry & monsters') : n.tag === 'ranged' ? 'behind walls' : n.tag === 'cav' ? 'vs ranged' : 'vs infantry';
    return `<span class="${mine ? 'pos' : 'neg'}">${t.icon} ${mine ? 'Your' : 'Enemy'} ${t.name} +${Math.round(n.pct * 100)}% ${n.side === 'atk' ? 'offense' : 'defense'}</span> <span class="muted">${vs}</span>`;
  });

function distributeLoot(avail, cap) {
  const out = { timber: 0, clay: 0, iron: 0, crop: 0 };
  let left = cap;
  let keys = RES.filter(k => avail[k] > 0.5);
  let guard = 0;
  while (left > 0.5 && keys.length && guard++ < 12) {
    const share = left / keys.length;
    const next = [];
    keys.forEach(k => {
      const take = Math.min(avail[k] - out[k], share);
      out[k] += take; left -= take;
      if (avail[k] - out[k] > 0.5) next.push(k);
    });
    keys = next;
  }
  RES.forEach(k => { out[k] = Math.floor(out[k]); });

}

  return `<h4>${title}</h4><table class="rt"><tr><th>Unit</th><th>Count</th><th>Lost</th></tr>` +
    rows.map(r => `<tr><td>${r.icon} ${esc(r.name)}</td><td>${fmt(r.n)}</td><td class="${r.lost ? 'neg' : ''}">${r.lost ? '−' + fmt(r.lost) : '0'}</td></tr>`).join('') + '</table>';
}
function battleBody(o) {

    `<div><small>Defender defense</small><b>🛡️ ${fmt(o.D)}</b><small>${o.wallTxt}</small></div></div>` +
    rowsTable(o.atkTitle, o.atkRows) + rowsTable(o.defTitle, o.defRows) +
    (o.loot ? `<div class="loot">💰 Plunder: ${lootTxt(o.loot)}</div>` : '') + (o.mnote || '') + (o.extra || '');
}

/* =========================================================
   SIMULATION (event-driven, offline-safe)
   ========================================================= */
function cityTag(c) { return S.cities.length > 1 && c ? c.name + ': ' : ''; }
function advanceTo(t) {
  const dt = t - S.time;
  if (dt <= 0) return;
  const gh = dt * S.speed / 3.6e6;
  S.cities.forEach(c => {
    const g = grossRates(c), cap = caps(c);
    ['timber', 'clay', 'iron'].forEach(k => { if (c.res[k] < cap.wh) c.res[k] = Math.min(cap.wh, c.res[k] + g[k] * gh); });
    const net = g.crop - buildingUpkeep(c) - troopUpkeep(c);
    let crop = c.res.crop + net * gh;
    if (crop < 0) { c.starve = (c.starve || 0) - crop; crop = 0; starveCity(c); }
    else if (net > 0) c.starve = 0;
    if (net >= 0 && c.res.crop >= cap.gr) crop = Math.max(c.res.crop, Math.min(crop, cap.gr));
    else crop = Math.min(cap.gr, crop);
    c.res.crop = crop;
    if (net <= 0) TRAIN_BLD.forEach(([b]) => { const q = c.trainQ[b]; if (q && q.length && q[0].next != null) q[0].next += dt; });
  });
  S.heroes.forEach(h => {
    if (!h.wounded && h.hp < 100 && heroStatus(h) === 'home') h.hp = Math.min(100, h.hp + 5 * gh);
    if (h.wounded && !h.reviveAt) { h.woundG = (h.woundG || 0) + gh; if (h.woundG >= 36) { h.wounded = false; h.hp = 40; h.woundG = 0; addReport('info', `${h.name} has recovered`, `${h.icon} ${esc(h.name)} recovered on their own after ${36} game hours of rest (40% health).`, t); } }
  });
  S.renown += renownRate() * gh;
  goldTick(gh);
  milTick(gh);
  warTick();
  siegeStarve(gh);
  processPlans(t);
  autoBuild(t);
  if (S.paused) { S.time = t; return; }
  settsRegen(gh);
  sitesRegen(gh);
  fxTick(gh);
  S.gameMs += dt * S.speed;
  S.time = t;
  worldTick(gameHours(), gh);
}
function starveCity(c) {
  const list = UNITS[S.faction].slice().sort((a, b) => b.upk - a.upk);
  let guard = 0;
  while (c.starve > 0 && guard++ < 200000) {
    let victim = null, where = null;
    for (const u of list) { if ((c.troops[u.id] || 0) > 0) { victim = u; where = 'home'; break; } }
    if (!victim) {
      for (const m of S.marches) {
        if (m.fromCity !== c.id) continue;
        for (const u of list) { if ((m.units[u.id] || 0) > 0) { victim = u; where = m; break; } }
        if (victim) break;
      }
    }
    if (!victim) { c.starve = 0; break; }
    if (where === 'home') c.troops[victim.id]--;
    else {
      where.units[victim.id]--;
      if (where.units[victim.id] <= 0) delete where.units[victim.id];
      if (!Object.keys(where.units).length && !where.heroId) S.marches = S.marches.filter(x => x !== where);
    }
    c.starve -= victim.upk;
    c.starved[victim.id] = (c.starved[victim.id] || 0) + 1;
  }
  if (c.starve < 0) c.starve = 0;
}
function flushStarve() {
  S.cities.forEach(c => {
    const keys = Object.keys(c.starved || {});
    if (!keys.length) return;
    const rows = keys.map(k => { const u = U(k); return `<div>${u.icon} ${esc(u.name)}: <b class="neg">−${c.starved[k]}</b></div>`; }).join('');
    addReport('loss', `${cityTag(c)}Famine! Troops have starved`, `The granaries of ${esc(c.name)} ran dry while Net Crop was negative. Soldiers deserted or perished:<div style="margin-top:6px">${rows}</div><div class="note" style="margin-top:8px">Upgrade Farmsteads or reduce this city's army.</div>`, S.time);
    toast(`☠️ Famine in ${c.name}!`, 'bad');
    c.starved = {};
  });
}
function nextEvent() {
  let best = null;
  const consider = (t, fn) => { if (t != null && (!best || t < best.t)) best = { t, fn }; };
  S.cities.forEach(c => {
    const cid = c.id;
    c.queues.forEach(q => { const qid = q.qid; consider(q.end, t => completeBuild(cid, qid, t)); });
    TRAIN_BLD.forEach(([b]) => { const q = c.trainQ[b]; if (q && q.length) consider(q[0].next, t => trainTick(cid, b, t)); });
    if (c.smithQ) consider(c.smithQ.end, t => smithDone(cid, t));
    if (c.feast) consider(c.feast.end, t => feastDone(cid, t));
  });
  S.marches.forEach(m => { const id = m.id; consider(m.phase === 'out' ? m.arrive : m.phase === 'siege' ? Math.min(m.siegeEnd, m.reliefAt || Infinity) : m.returnAt, t => marchEvent(id, t)); });
  S.incoming.forEach(r => { if (r.allyRelief && r.phase === 'siege') { const id = r.id; consider(r.allyRelief.at, t => allyReliefBattle(id, t)); } });
  S.incoming.forEach(r => { const id = r.id; if (r.siege && r.phase !== 'siege') consider(r.arrive, t => beginSiege(id, t)); else consider(r.phase === 'siege' ? r.siegeEnd : r.arrive, t => incomingHits(id, t)); });
  consider(S.nextSiege, spawnSiege);
  consider(S.nextHoldAtk, spawnHoldAttack);
  S.heroes.forEach(h => { if (h.reviveAt) { const id = h.id; consider(h.reviveAt, t => reviveDone(id, t)); } });
  (S.agents || []).forEach(a => { if (a.mission) { const id = a.id; consider(a.mission.hit ? a.mission.end : a.mission.hitAt, t => agentEvent(id, t)); } });
  S.trades.forEach(tr => { const id = tr.id; consider(tr.phase === 'out' ? tr.arrive : tr.returnAt, t => tradeEvent(id, t)); });

}
function simulate(now) {
  let changed = false, guard = 0;
  UI.quiet = now - S.time > 30000;
  while (guard++ < 40000) {
    const ev = nextEvent();
    if (!ev || ev.t > now) break;
    // step long gaps so world events and production stay on time
    const stepMs = 3.6e6 / S.speed * 2;
    let g2 = 0;
    while (ev.t - S.time > stepMs && g2++ < 20000) advanceTo(S.time + stepMs);
    advanceTo(ev.t);
    ev.fn(ev.t);
    changed = true;
  }
  const stepMs = 3.6e6 / S.speed * 2;
  let g2 = 0;
  while (now - S.time > stepMs && g2++ < 20000) advanceTo(S.time + stepMs);
  advanceTo(now);
  flushStarve();
  UI.quiet = false;
  return changed;
}

/* ----- events ----- */
function completeBuild(cid, qid, t) {
  const c = cityById(cid);
  if (!c) return;
  const q = c.queues.find(x => x.qid === qid);
  if (!q || q.end > t) return;
  const maxL = q.kind === 'field' ? FIELD_MAX : BLD_DEF[q.id].max;
  const tierUp = tierOf(q.to, maxL) > tierOf(q.to - 1, maxL);
  if (q.kind === 'field') c.fields[q.id].lvl = q.to;
  else c.bld[q.id] = q.to;
  c.queues = c.queues.filter(x => x.qid !== qid);
  if (tierUp) {
    c.flash = { id: q.kind === 'field' ? 'f' + q.id : q.id, until: Date.now() + 8000 };
    if (q.to > 1 || q.kind !== 'field') toast(`✨ ${q.name} reached Tier ${roman(tierOf(q.to, maxL))}!`, 'good');
  }
  addReport('build', `${cityTag(c)}${q.name} reached Lv ${q.to}`, `Construction finished in ${esc(c.name)}. ${q.kind === 'field' ? 'Production increased.' : esc(BLD_DEF[q.id].desc)}`, t);
  toast(`🔨 ${cityTag(c)}${q.name} → Lv ${q.to}`, 'good');
}
function trainTick(cid, b, t) {
  const c = cityById(cid);
  if (!c) return;
  const arr = c.trainQ[b];
  const q = arr && arr[0];
  if (!q || q.next == null || q.next > t + 1) return;
  c.troops[q.unit] = (c.troops[q.unit] || 0) + 1;
  q.left--;
  if (q.left > 0) q.next = t + q.each;
  else {
    arr.shift();
    const u = U(q.unit);
    toast(`${u.icon} ${cityTag(c)}${q.total} ${u.name} ready`, 'good');
    if (arr.length) arr[0].next = t + arr[0].each;
  }
}
function reviveDone(id, t) {
  const h = heroById(id);
  if (!h || !h.reviveAt || h.reviveAt > t + 1) return;
  h.wounded = false; h.hp = 100; h.reviveAt = null;
  const c = cityById(h.cityId);
  addReport('info', `${h.name} has recovered`, `${h.icon} ${esc(h.name)} is back on their feet and guards ${esc(c ? c.name : 'your capital')}.`, t);
  toast(`${h.icon} ${h.name} is ready for battle`, 'good');
}
function marchEvent(id, t) {
  const m = S.marches.find(x => x.id === id);
  if (!m) return;
  if (m.phase === 'siege') return playerSiegeEvent(m, t);
  if (m.phase === 'out') {
    if (m.mode === 'siege') beginPlayerSiege(m, t);
    else if (m.mode === 'relieve') resolveRelieve(m, t);
    else if (m.mode === 'settle') resolveSettle(m, t);
    else if (m.mode === 'adventure') resolveAdventure(m, t);
    else if (m.mode === 'explore') resolveExplore(m, t);
    else if (m.siteId) resolveSiteAttack(m, t);
    else if (m.mode === 'reinforce') resolveReinforce(m, t);
    else resolveAttack(m, t);
  } else returnHome(m, t);
}
function marchBack(m, t) { m.phase = 'back'; m.arrive = t; m.returnAt = t + m.travel; }
function resolveSettle(m, t) {
  const err = canFound(m.tx, m.ty);
  const from = cityById(m.fromCity) || capital();
  if (err) {
    marchBack(m, t);
    addReport('info', 'Settlers could not found a city', `Your settlers reached (${m.tx}|${m.ty}) but could not settle: <b>${esc(err)}</b>. They are returning to ${esc(from.name)}.`, t);
    toast('🏕️ Settlers could not found a city', 'bad');
    return;
  }
  const c = makeCity(m.tx, m.ty, nextCityName(), false);
  c.shieldG = gameHours() + CITY_SHIELD_H;
  S.cities.push(c);

/* =========================================================
   WORLD MAP (canvas)
   ========================================================= */
function settAt(x, y) { return S.setts.find(s => s.x === x && s.y === y); }
function cityAt(x, y) { return S.cities.find(c => c.x === x && c.y === y); }
function computeTerritory() {
  const NN = MAP_W * MAP_H;
  const own = new Uint8Array(NN), bestD = new Float32Array(NN).fill(1e9), corr = new Float32Array(NN);
  const claim = (sx, sy, r, o) => {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const x = sx + dx, y = sy + dy;
      if (!inMap(x, y)) continue;
      const d = Math.hypot(dx, dy);
      if (d > r + 0.2) continue;
      const i = idx(x, y);
      if (TK[WORLD.terr[i]] === 'sea') continue;
      if (d < bestD[i]) { bestD[i] = d; own[i] = o; }
    }
  };
  S.setts.forEach(s => { if (!s.dead) claim(s.x, s.y, s.kind === 'capital' || s.kind === 'citadel' ? 5 : 3, FAC_ORDER.indexOf(s.fac) + 2); });
  S.cities.forEach(c => claim(c.x, c.y, c.capital ? 4 : 3, 1));
  (S.sites || []).forEach(st => { if (st.owner) claim(st.x, st.y, 1, 1); });
  if (UI.overlay === 'corruption') {
    const srcs = S.setts.filter(s => !s.dead && CORR_W[s.fac]);
    for (let y = MAP_Y0; y <= MAP_Y1; y++) for (let x = MAP_X0; x <= MAP_X1; x++) { if (srcs.some(s => Math.abs(s.x - x) < 17 && Math.abs(s.y - y) < 17)) corr[idx(x, y)] = corruptionAt(x, y); }
  }
  MAPV.own = own; MAPV.corr = corr;
}
function ownColor(o) { return o === 1 ? '#f2d27e' : FACS[FAC_ORDER[o - 2]].color; }
function buildMini() {
  if (!MAPV.terr || MAPV.terrSeed !== S.seed) {
    const tc = document.createElement('canvas');
    tc.width = MAP_W; tc.height = MAP_H;
    const tx = tc.getContext('2d');
    for (let y = MAP_Y0; y <= MAP_Y1; y++) for (let x = MAP_X0; x <= MAP_X1; x++) {
      const i = idx(x, y);
      tx.fillStyle = WORLD.lane[i] ? '#1d4566' : WORLD.col[i];
      tx.fillRect(x - MAP_X0, MAP_Y1 - y, 1, 1);
    }
    MAPV.terr = tc; MAPV.terrSeed = S.seed;
  }
  const cv = document.createElement('canvas');
  cv.width = MAP_W * 2; cv.height = MAP_H * 2;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(MAPV.terr, 0, 0, MAP_W * 2, MAP_H * 2);
  S.setts.forEach(s => {
    if (s.dead) return;
    ctx.fillStyle = FACS[s.fac].color;
    ctx.fillRect((s.x - MAP_X0) * 2 - 1, (MAP_Y1 - s.y) * 2 - 1, 4, 4);
  });
  ctx.fillStyle = '#f2d27e';
  S.cities.forEach(c => ctx.fillRect((c.x - MAP_X0) * 2 - 2, (MAP_Y1 - c.y) * 2 - 2, 6, 6));
  MAPV.mini = cv;
}
function requestDraw() {
  if (MAPV.raf) return;
  MAPV.raf = requestAnimationFrame(() => { MAPV.raf = 0; drawMap(); });
}
function pathPos(path, frac) {
  if (!path || !path.length) return null;
  const f = clamp(frac, 0, 1) * (path.length - 1);
  const i = Math.floor(f), t = f - i;
  const a = path[i], b = path[Math.min(path.length - 1, i + 1)];

}
function mapShow(k) { if (!UI.mapShow) UI.mapShow = { setts: 1, sites: 1, pois: 1, lm: 1 }; return !!UI.mapShow[k]; }
function toggleShow(k) { mapShow(k); UI.mapShow[k] = UI.mapShow[k] ? 0 : 1; rerender(); requestDraw(); }
function mapErr(e) { if (!MAPV.errShown) { MAPV.errShown = true; try { console.warn('Map layer skipped:', e); } catch (_) {} } }
function drawMap() {
  const cv = $('mapCv');
  if (!cv || !S || !WORLD) return;
  const box = cv.parentElement;
  const W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  if (!MAPV.terr) buildMini();
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {

    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#050403';
  ctx.fillRect(0, 0, W, H);
  const z = UI.cam.z, cx = UI.cam.x, cy = UI.cam.y;
  const sxOf = x => W / 2 + (x - cx) * z, syOf = y => H / 2 - (y - cy) * z;
  const x0 = Math.max(MAP_X0, Math.floor(cx - W / 2 / z) - 1), x1 = Math.min(MAP_X1, Math.ceil(cx + W / 2 / z) + 1);
  const y0 = Math.max(MAP_Y0, Math.floor(cy - H / 2 / z) - 1), y1 = Math.min(MAP_Y1, Math.ceil(cy + H / 2 / z) + 1);
  const ov = UI.overlay, own = MAPV.own, corr = MAPV.corr;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const coarse = z < 9;
  if (coarse) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(MAPV.terr, sxOf(MAP_X0) - z / 2, syOf(MAP_Y1) - z / 2, MAP_W * z, MAP_H * z);
  }
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = idx(x, y);
      const px = sxOf(x) - z / 2, py = syOf(y) - z / 2;
      if (!coarse) {
        ctx.fillStyle = WORLD.col[i];
        ctx.fillRect(px, py, z + 0.6, z + 0.6);
        if (WORLD.lane[i]) { ctx.fillStyle = '#7fb6d6'; ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.arc(px + z / 2, py + z / 2, Math.max(1.2, z * 0.09), 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
      }
      if (ov === 'territory' && own && own[i]) { ctx.fillStyle = ownColor(own[i]) + '30'; ctx.fillRect(px, py, z + 0.6, z + 0.6); }
      else if (ov === 'corruption' && corr && corr[i] > 1) { ctx.fillStyle = `rgba(150,40,200,${Math.min(0.75, corr[i] / 80)})`; ctx.fillRect(px, py, z + 0.6, z + 0.6); }
      if (z >= 18) {

        if (dec && hash2(x, y, S.seed + 5) < 0.55 && !settAt(x, y) && !cityAt(x, y)) {

    }
  }
  if (ov === 'territory' && own && z >= 6) {
    ctx.lineWidth = Math.max(1, z / 12);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = idx(x, y), o = own[i];

  }

    for (let y = y0 - 1; y <= y1; y++) { const py = syOf(y) - z / 2; ctx.moveTo(0, py); ctx.lineTo(W, py); }

  }

    if (r.siege || raidVisible(r, now)) drawRoute(r.path, (now - r.launched) / Math.max(1, r.arrive - r.launched), '#ff5a45', r.siege ? '🏰' : FACS[r.fac].icon);

function siegeNoteHTML(c) {

}
function sackCity(c, r, surv) {

  const st = Math.floor(Math.max(0, (S.gold || 0) - goldSafe()) * 0.25);
  S.gold -= st;
  S.stats.goldLost = (S.stats.goldLost || 0) + st;
  c.shieldG = gameHours() + 48;
  S.stats.sackedTimes = (S.stats.sackedTimes || 0) + 1;
  let t = `<div class="note bad" style="margin-top:8px">🔥 ${esc(c.name)} is sacked: 40% of the unprotected stores burned${st ? ` and 🪙 ${fmt(st)} gold looted` : ''}. The city is safe from raids for 2 game days while it recovers.</div>`;
  t += aiWreck(c, r, surv, 1.5);
  return t;
}
function loseCity(c, r, surv) {

  const base = clamp(Math.round(c.bld.keep + avgF), 3, 35);
  const cap = capital();
  const s = { id: S.nextId++, fac: r.fac, kind: 'settlement', name: c.name, x: c.x, y: c.y, base, bonus: 0, dead: false, respawnG: null, army: {}, res: {}, gx: 0, stunG: gameHours() + 24, hitG: gameHours(), lostCity: true };
  S.setts.push(s);
  s.army = Object.assign({}, surv);
  RES.forEach(k => { s.res[k] = Math.round(c.res[k] * 0.5); });
  S.heroes.forEach(h => { if (h.cityId === c.id) { const home = heroStatus(h) === 'home'; h.cityId = cap.id; if (home) { h.hp = 0; h.wounded = true; h.reviveAt = null; h.streak = 0; } } });
  (S.agents || []).forEach(a => { if (a.cityId === c.id) a.cityId = cap.id; });
  S.marches.forEach(m => { if (m.fromCity === c.id) m.fromCity = cap.id; });
  (S.sites || []).forEach(st => { if (st.owner === c.id) { st.owner = null; st.gar = {}; st.army = {}; } });
  S.incoming = S.incoming.filter(x => x.cityId !== c.id || x.id === r.id);
  S.cities = S.cities.filter(x => x.id !== c.id);

  S.stats.citiesLost = (S.stats.citiesLost || 0) + 1;
  LM_VER++; PCACHE.clear();
  return `<div class="note bad" style="margin-top:8px">🏴 ${esc(c.name)} has fallen. Its garrison is slain${S.heroes.some(h => h.cityId === cap.id && h.wounded && h.hp === 0) ? ', any Lord inside was carried wounded to ' + esc(cap.name) : ''} and its holdings are lost. The ${FACS[r.fac].name} now hold it as a Lv ${base} settlement — assault it with a Lord and tick <b>Claim</b> to take it back.</div>`;
}

/* ----- Your sieges against the AI ----- */
function siegeable(s) { return !!s && !s.dead && ['settlement', 'capital', 'citadel'].includes(s.kind); }
function claimableSiege(s) { return !!s && !s.dead && (s.kind === 'settlement' || s.kind === 'capital'); }
function siegeHoursFor(p) { return clamp(24 / (1 + p * 0.06), 6, 24); }
function siegeDropFor(p) { return 2 + Math.floor(p * 0.4); }
function beginPlayerSiege(m, t) {

  if (helpers.length && Math.random() < (s.kind === 'capital' ? 0.85 : 0.6)) {
    const src = helpers.sort((a, b) => Math.hypot(a.x - s.x, a.y - s.y) - Math.hypot(b.x - s.x, b.y - s.y))[0];
    m.reliefAt = t + g2r(H * rand(0.3, 0.8) * 3600); m.reliefFrom = src.id;

  toast(`🏰 Siege of ${s.name} begins`, 'good');
}
function playerSiegeEvent(m, t) {
  const s = S.setts.find(x => x.id === m.settId);
  if (m.reliefAt && m.reliefAt <= t + 1 && m.reliefAt < m.siegeEnd) { const rf = m.reliefFrom; m.reliefAt = null; return reliefBattle(m, s, rf, t); }
  if (s) delete s.besiegedBy;
  const wall = s ? settWall(s) : 0;
  const kit = myKit(m, t);
  m.siegeDrop = Math.min(wall, siegeDropFor(m.siegeP || 0) + 2 * kit.rams);
  m.towers = kit.tower; m.cats = kit.cat;
  m.mode = 'attack'; m.sieged = true; m.phase = 'out';
  resolveAttack(m, t);
}
function liftPlayerSiege(m, t) {
  const s = S.setts.find(x => x.id === m.settId);
  if (s) delete s.besiegedBy;
  m.phase = 'back'; m.arrive = t; m.returnAt = t + m.travel; m.recalled = true; m.loot = null; m.reliefAt = null;
}
function reliefBattle(m, s, srcId, t) {
  const src = S.setts.find(x => x.id === srcId && !x.dead);

  const army = {};
  for (const k in src.army) { const n = Math.floor(src.army[k] * 0.4); if (n > 0) { army[k] = n; src.army[k] -= n; } }
  if (sumObj(army) < 3) return;
  const atk = Object.keys(army).map(k => ({ key: k, n: army[k], att: FOES[k].att, cls: FOES[k].cls }));
  const h = m.heroId ? heroById(m.heroId) : null;
  const def = Object.keys(m.units).filter(k => m.units[k] > 0).map(k => { const u = U(k); return { key: k, n: m.units[k], di: uDi(u), dc: uDc(u) }; });

  const res = battle(atk, def, { mode: 'raid', wallMult: 1, baseDef: 0, luck: rand(0.9, 1.1), defMult: (1 + (h ? heroDefBonus(h) : 0)) * (1 + mk.pal), wall: 0 });

  if (h) defRows.unshift({ icon: h.icon, name: h.name, n: 1, lost: 0 });

  toast(res.attWin ? `☠️ Siege of ${s.name} broken` : `🛡️ Relief army beaten at ${s.name}`, res.attWin ? 'bad' : 'good');
}
function resolveRelieve(m, t) {

  if (!dest) { marchBack(m, t); return; }
  if (!r) return resolveReinforce(m, t);
  const h = m.heroId ? heroById(m.heroId) : null;
  const res = fightHost(m.units, h, r, false);
  const o = applyHostFight(m.units, h, r, res);
  m.units = o.surv;
  if (h && h.wounded) m.heroId = null;
  let title;
  if (res.attWin || !sumObj(r.army)) {
    endSiege(r, 'relief', t);
    S.stats.siegesBroken = (S.stats.siegesBroken || 0) + 1; S.renown += 100;
    title = `🏰 Siege of ${dest.name} broken!`;
    o.extra += `<div class="note good" style="margin-top:8px">Your relief army drives off the ${FACS[r.fac].name} and enters ${esc(dest.name)}. ⭐ +100 Renown.</div>`;
    if (o.survN || m.heroId) return (addReport('win', title, battleBody({ mnote: matchNoteHTML(res, 'atk'), A: res.A, D: res.D, luck: res.luck, wallTxt: 'open field', atkTitle: 'Your relief army', atkRows: o.atkRows, defTitle: `${FACS[r.fac].icon} ${esc(r.fromName)}`, defRows: o.defRows, loot: null, extra: o.extra }), t), resolveReinforce(m, t));

  } else {
    title = `Relief of ${dest.name} failed`;
    if (o.survN || m.heroId) marchBack(m, t); else S.marches = S.marches.filter(x => x.id !== m.id);
  }
  addReport(res.attWin ? 'win' : 'loss', title, battleBody({ mnote: matchNoteHTML(res, 'atk'), A: res.A, D: res.D, luck: res.luck, wallTxt: 'open field', atkTitle: 'Your relief army', atkRows: o.atkRows, defTitle: `${FACS[r.fac].icon} ${esc(r.fromName)}`, defRows: o.defRows, loot: null, extra: o.extra }), t);

/* ----- AI attacks on your holdings ----- */
function spawnHoldAttack(t) {
  S.nextHoldAtk = t + g2r(3600 * DIFF().raidH * rand(3, 4));
  if (S.peace || S.paused || gameHours() < protectH()) return;
  const held = (S.sites || []).filter(st => st.owner && cityById(st.owner) && !S.incoming.some(r => r.siteId === st.id));
  if (!held.length) return;
  const ratsOk = FAC_ORDER.includes('skaven') && stance('skaven') === 'war' && raidFacOk('skaven', gameHours());

  const near = S.setts.filter(x => !x.dead && !special(x) && x.kind !== 'citadel' && raidFacOk(x.fac, gameHours()) && stance(x.fac) === 'war' && !(x.fac === 'chaos' && !S.invasion) && Math.hypot(x.x - st.x, x.y - st.y) <= (x.fac === 'skaven' && st.kind === 'warp' ? 34 : 22));
  if (!near.length) return;
  const rats = st.kind === 'warp' ? near.filter(x => x.fac === 'skaven') : [];
  const src = (rats.length ? rats : near).sort((a, b) => Math.hypot(a.x - st.x, a.y - st.y) - Math.hypot(b.x - st.x, b.y - st.y))[0];
  const p = findPath(src.x, src.y, st.x, st.y, true);
  if (!isFinite(p.cost)) return;
  const frac = (0.15 + Math.random() * 0.15) * DIFF().raidSize, army = {};
  for (const k in src.army) { const n = Math.floor(src.army[k] * frac); if (n > 0) army[k] = n; }
  if (sumObj(army) < 3) return;
  { let dP = 5 * st.lvl; const gm = Object.assign({}, st.gar || {}); for (const k in (st.mil || {})) gm[k] = (gm[k] || 0) + st.mil[k]; for (const k in gm) { const u = U(k); if (u) dP += gm[k] * (u.di + u.dc) / 2; } if (hostPower(army) < dP * 0.9) return; }
  const spd = Math.min(...Object.keys(army).map(k => FOES[k].spd));
  const travel = g2r(Math.max(2, p.cost / spd) * 3600);
  S.incoming.push({ id: S.nextId++, siteId: st.id, settId: src.id, fac: src.fac, cityId: st.owner, fromName: src.name, fx: src.x, fy: src.y, path: p.path, army, mode: 'attack', launched: t, arrive: t + travel, spotted: false, estF: rand(0.8, 1.2) });
}
function resolveSiteDefense(r, t) {
  S.incoming = S.incoming.filter(x => x.id !== r.id);
  const st = (S.sites || []).find(x => x.id === r.siteId);
  if (!st || !st.owner) return;
  const K = SITE_KINDS[st.kind], oc = cityById(st.owner);
  st.gar = st.gar || {};
  const atk = Object.keys(r.army).filter(k => r.army[k] > 0).map(k => ({ key: k, n: r.army[k], att: FOES[k].att, cls: FOES[k].cls }));
  st.mil = st.mil || {};
  const ids = new Set([...Object.keys(st.gar), ...Object.keys(st.mil)]);
  const def = [...ids].filter(k => U(k) && (st.gar[k] || 0) + Math.floor(st.mil[k] || 0) > 0).map(k => { const u = U(k); return { key: k, n: (st.gar[k] || 0) + Math.floor(st.mil[k] || 0), di: uDi(u), dc: uDc(u) }; });
  const res = battle(atk, def, { mode: 'attack', wallMult: 1, baseDef: 5 * st.lvl, luck: rand(0.9, 1.1), wall: 0 });
  const atkRows = [], defRows = [], surv = {};
  atk.forEach(a => { const lost = Math.min(a.n, Math.round(a.n * res.attLoss)); if (a.n - lost > 0) surv[a.key] = a.n - lost; atkRows.push({ icon: FOES[a.key].icon, name: FOES[a.key].name, n: a.n, lost }); });
  def.forEach(d => { const lost = Math.min(d.n, Math.round(d.n * res.defLoss)); const g0 = st.gar[d.key] || 0, lg = Math.min(g0, Math.round(lost * g0 / Math.max(1, d.n))); st.gar[d.key] = g0 - lg; if (st.gar[d.key] <= 0) delete st.gar[d.key]; if (st.mil[d.key]) st.mil[d.key] = Math.max(0, st.mil[d.key] - (lost - lg)); defRows.push({ icon: U(d.key).icon, name: U(d.key).name, n: d.n, lost }); });
  let extra = vetAfter(def, res.defLoss, !res.attWin, res.A / Math.max(1, res.D));
  campStat(atkRows, defRows, false, !res.attWin, null);
  let title;
  if (res.attWin) {
    st.owner = null; st.gar = {}; st.mil = {}; st.army = surv; LM_VER++;
    if (S.faction === 'dwarfs') bogAdd(r.fac, `They seized our ${K.name}`);
    S.stats.sitesLost = (S.stats.sitesLost || 0) + 1;
    title = `${K.icon} ${K.name} lost to the ${FACS[r.fac].name}`;
    extra += `<div class="note bad" style="margin-top:8px">The ${FACS[r.fac].name} hold the ${K.name} now${oc ? ' — ' + esc(oc.name) + ' loses its bonus' : ''}. Assault it to win it back. 💡 Station troops at your holdings to defend them.</div>`;
  } else { title = `${K.icon} ${K.name} held against the ${FACS[r.fac].name}`; S.renown += 25; }
  addReport(res.attWin ? 'loss' : 'def', title, battleBody({ mnote: matchNoteHTML(res, 'def'), A: res.A, D: res.D, luck: res.luck, wallTxt: 'no walls', atkTitle: `${FACS[r.fac].icon} ${esc(r.fromName)}`, atkRows, defTitle: `Garrison of the ${K.name}`, defRows, loot: null, extra }), t);
  toast(res.attWin ? `${K.icon} ${K.name} lost!` : `${K.icon} ${K.name} held!`, res.attWin ? 'bad' : 'good');
  UI.dirty = true;
}

function addGold(g) { if (!(g > 0)) return; S.gold = (S.gold || 0) + g; S.stats.goldEarned = (S.stats.goldEarned || 0) + g; }

function goldIncome() {

  t *= (1 + TB('tax')) * (hasMon('hall') ? 1.15 : 1);

  t += tradeIncome();

}
function mercUpkeep() {

  S.cities.forEach(c => { for (const k in c.troops) add(k, c.troops[k] || 0); });
  S.marches.forEach(m => { for (const k in (m.units || {})) add(k, m.units[k] || 0); });

/* ----- Veterancy ----- */
const VET_RANKS = [[0, 'Recruit'], [1, 'Blooded'], [3, 'Seasoned'], [6, 'Veteran'], [10, 'Elite'], [15, 'Legendary']];
function unitTotal(id) {
  let n = 0;
  S.cities.forEach(c => { n += c.troops[id] || 0; });
  S.marches.forEach(m => { n += (m.units && m.units[id]) || 0; });
  return n;
}
function vetAvg(id) {
  const n = unitTotal(id);

  return ((S.vxp && S.vxp[id]) || 0) / n;
}
function vetRank(id) {
  const u = U(id);
  if (!u || u.role === 'Settler') return 0;
  const a = vetAvg(id);
  let r = 0;
  VET_RANKS.forEach((x, i) => { if (a >= x[0]) r = i; });
  return u.ror ? Math.max(3, r) : r;
}
function vetMult(id) { return 1 + 0.03 * vetRank(id); }
function vetStars(id) { const r = vetRank(id); return r ? `<span style="color:var(--gold)" title="${VET_RANKS[r][1]}">${'★'.repeat(r)}</span>` : ''; }
function vetBadge(id) {
  const r = vetRank(id), u = U(id);
  if (!u || u.role === 'Settler' || !unitTotal(id) && !u.ror) return '';
  const nx = VET_RANKS[r + 1];
  return `<div class="muted small">${r ? vetStars(id) + ' ' : ''}${VET_RANKS[r][1]} +${3 * r}%${nx && unitTotal(id) ? ` · ${vetAvg(id).toFixed(1)}/${nx[0]} XP each` : ''}</div>`;
}
function vetAfter(list, lossFrac, won, ratio) {
  if (!S.vxp) S.vxp = {};
  const gain = (won ? 1 : 0.5) * clamp(ratio * 1.5, 0.2, 1.5) * (1 + TB('vet'));
  const ups = [];
  list.forEach(a => {
    const u = a.key !== 'hero' ? U(a.key) : null;
    if (!u || u.role === 'Settler') return;
    const before = vetRank(a.key);
    const lost = Math.min(a.n, Math.round(a.n * lossFrac)), surv = a.n - lost;
    const now = unitTotal(a.key), pool = S.vxp[a.key] || 0;
    const avgB = (now + lost) > 0 ? pool / (now + lost) : 0;
    S.vxp[a.key] = Math.max(0, pool - avgB * lost) + surv * gain;
    const after = vetRank(a.key);
    if (after > before) ups.push(`${u.icon} ${u.name} ${'★'.repeat(after)} ${VET_RANKS[after][1]}`);
  });
  return ups.length ? `<div class="note good" style="margin-top:8px">🎖️ Promoted: ${ups.join(' · ')}</div>` : '';
}

/* ----- Battle forecasts & simulator ----- */
const ODDS = {
  sure: '<span class="pos">Certain victory</span>',
  likely: '<span class="pos">Likely victory</span>',
  risky: '<span style="color:var(--gold2)">Coin-toss — luck decides</span>',
  lose: '<span class="neg">Defeat</span>'

function settArmyAt(s, hrs) {
  if (!hrs || hrs <= 0 || settBesieged(s)) return s.army;
  const tgt = settArmy(s), rate = (s.champ === 'nurgle' ? 0.2 : 0.1) * Math.max(0.2, 1 - 0.12 * settDmg(s, 'military')), f = 1 - Math.exp(-rate * hrs), a = {};
  new Set([...Object.keys(s.army), ...Object.keys(tgt)]).forEach(k => { const cur = s.army[k] || 0, t = tgt[k] || 0; a[k] = cur < t ? cur + (t - cur) * f : cur; });
  return a;
}
function settTarget(s, hrs) {
  return { aid: allyAid(s), army: settArmyAt(s, hrs), lvl: settLvl(s), wall: settWall(s), isSite: false, defMult: settDefMult(s), name: s.name, icon: settIcon(s),
    loot: RES.reduce((a, k) => a + Math.max(0, (s.res[k] || 0) - settCranny(s)), 0) };
}
function siteTarget(st) {
  return { army: st.army, lvl: st.lvl, wall: 0, isSite: true, name: SITE_KINDS[st.kind].name, icon: SITE_KINDS[st.kind].icon,
    loot: RES.reduce((a, k) => a + (st.res[k] || 0), 0) };
}
function forecastBattle(units, h, tgt, mode) {
  const atk = [];
  let siege = 0, carry = 0;
  Object.keys(units).forEach(k => {
    const n = Math.floor(units[k] || 0);
    if (n <= 0) return;
    const u = U(k);
    if (!u || u.role === 'Settler') return;
    atk.push({ key: k, n, att: uAtt(u), cls: u.cls });
    carry += n * u.carry;
    if (u.role === 'Siege') siege += n;
  });
  if (h) atk.push({ key: 'hero', n: 1, att: heroAtt(h), cls: 'inf' });
  if (mode === 'attack') (tgt.aid || []).forEach(a => atk.push(a));
  const drop = !tgt.isSite && siege > 0 ? Math.min(tgt.wall, Math.floor(Math.sqrt(siege * 2.5))) : 0;
  const effWall = tgt.wall - drop;
  const def = Object.keys(tgt.army).filter(k => tgt.army[k] >= 0.5 && FOES[k]).map(k => ({ key: k, n: tgt.army[k], di: FOES[k].di, dc: FOES[k].dc }));
  const attMult = (1 + (h ? heroOffBonus(h) : 0)) * (waaaghActive() ? 1.25 : 1);
  const base = { mode, wallMult: Math.pow(1.03, effWall), baseDef: (tgt.isSite ? 5 : 10) * tgt.lvl, attMult, wall: effWall, defMult: tgt.defMult || 1 };
  const r = battle(atk, def, Object.assign({}, base, { luck: 1 }));
  const lo = battle(atk, def, Object.assign({}, base, { luck: 0.9 }));
  const hi = battle(atk, def, Object.assign({}, base, { luck: 1.1 }));
  r.odds = !atk.length ? 'lose' : lo.attWin ? 'sure' : r.attWin ? 'likely' : hi.attWin ? 'risky' : 'lose';
  r.drop = drop; r.effWall = effWall; r.atk = atk; r.def = def; r.attMult = attMult;
  const cm = plunderMult() * (1 + (h ? 0.05 * h.skills.logistics : 0));
  r.carry = carry * cm;
  r.survCarry = atk.filter(a => a.key !== 'hero').reduce((t, a) => t + (a.n - Math.min(a.n, Math.round(a.n * r.attLoss))) * U(a.key).carry, 0) * cm;
  return r;
}
function simTargets() {

  const si = (S.sites || []).filter(x => !x.owner).map(x => ({ id: 'site:' + x.id, label: `${SITE_KINDS[x.kind].icon} ${SITE_KINDS[x.kind].name} · Lv ${x.lvl}`, d: Math.hypot(x.x - c.x, x.y - c.y) }));

function simAdvice(r, t, m) {

  if (foot > 0.5 && r.aSh.monster < 0.1 && UNITS[S.faction].some(u => unitTag(u.id) === 'monster')) tips.push(`Mostly infantry — 🦣 monsters or ⚙️ war machines would gain +${Math.round(foot * 25)}%.`);

function liveChampion() { return S.end && S.end.champId ? S.setts.find(s => s.id === S.end.champId && !s.dead) : null; }

function campStat(atkRows, defRows, playerAtk, playerWon, loot) {
  const st = S.stats;

  const mine = playerAtk ? atkRows : defRows, theirs = playerAtk ? defRows : atkRows;
  st.kills = (st.kills || 0) + sum(theirs);
  st.lost = (st.lost || 0) + sum(mine);
  st.battles = (st.battles || 0) + 1;
  if (!playerWon && playerAtk) st.defeats = (st.defeats || 0) + 1;
  const lv = loot ? RES.reduce((a, k) => a + (loot[k] || 0), 0) : 0;
  if (playerAtk) st.loot = (st.loot || 0) + lv;
  else { st.lootLost = (st.lootLost || 0) + lv; if (playerWon) st.repelled = (st.repelled || 0) + 1; else st.plundered = (st.plundered || 0) + 1; }

function campaignScore() {
  const st = S.stats || {};
  const dm = { easy: 0.75, normal: 1, hard: 1.3, brutal: 1.6 }[S.diff && S.diff.preset] || 1;
  const slain = S.end ? S.end.slain.length : 0;
  let sc = (S.victory ? 5000 : 0) + slain * 2500 + (S.end && S.end.done ? 5000 : 0);
  if (st.victoryDay) sc += Math.max(0, 60 - st.victoryDay) * 100;
  sc += (st.wins || 0) * 5 + Math.min(15000, (st.kills || 0) * 0.5) + (st.sacks || 0) * 150 + (st.razed || 0) * 40 + (st.sites || 0) * 100 + (st.adv || 0) * 20 + (st.repelled || 0) * 30;
  sc += Math.max(st.peakCities || 0, S.cities.length) * 400 + Math.max(0, ...S.heroes.map(h => h.level)) * 80 + Object.keys(S.quests || {}).length * 30 + S.items.filter(i => i.r === 3).length * 150;

/* =========================================================
   MARKETPLACE — carts, transfers, barter, auto-supply

const CART = {
  empire: { cap: 750, spd: 16, name: 'wagons' },
  elves: { cap: 600, spd: 20, name: 'carts' },
  greenskins: { cap: 1000, spd: 12, name: 'carts' },
  dwarfs: { cap: 1200, spd: 10, name: 'ore wagons' }
};
function cartsBusy(c) { return S.trades.filter(t => t.fromCity === c.id).reduce((s, t) => s + t.carts, 0); }
function cartsFree(c) { return Math.max(0, c.bld.market - cartsBusy(c)); }
function cartsNeeded(total) { return Math.ceil(total / CART[S.faction].cap); }
function incomingTrade(c, r) { return S.trades.filter(t => t.kind === 'send' && t.toCity === c.id && t.phase === 'out').reduce((s, t) => s + (t.res[r] || 0), 0); }
function barterRate(fac) { return clamp(0.5 + (S.rel[fac] + 100) / 400 + (stance(fac) === 'allied' ? 0.1 : 0) + (hasTreaty(fac, 'trade') ? 0.1 : 0), 0.5, 1); }
function barterTarget(c, fac) {
  const cands = S.setts.filter(s => !s.dead && s.fac === fac).map(s => ({ s, p: pathFrom(c, s.x, s.y) })).filter(o => isFinite(o.p.cost));
  cands.sort((a, b) => a.p.cost - b.p.cost);
  return cands[0] || null;
}
function pushTrade(c, o, depart) {
  if (cityBesieged(c) || (o.toCity && cityBesieged(cityById(o.toCity)))) toast('⚠️ A besieged city’s wagons may be ambushed — they travel anyway', 'bad');
  const travel = g2r(o.path.cost / CART[S.faction].spd * 3600);
  const tr = Object.assign({ id: S.nextId++, fromCity: c.id, depart, arrive: depart + travel, travel, phase: 'out', returnAt: null }, o, { path: (o.path && o.path.path) || [] });
  delete tr.pathObj;
  S.trades.push(tr);
  return tr;
}
function mktAmounts() { const a = {}; RES.forEach(r => { a[r] = Math.max(0, Math.floor(+UI.mkt.res[r] || 0)); }); return a; }
function sendResources() {
  simulate(Date.now());
  const c = CUR();
  const dest = cityById(UI.mkt.to);
  if (!dest || dest.id === c.id) return toast('Choose a destination city', 'bad');
  const amt = mktAmounts();
  RES.forEach(r => { amt[r] = Math.min(amt[r], Math.floor(c.res[r])); });
  const total = sumObj(amt);
  if (total <= 0) return toast('Load some resources first', 'bad');
  const carts = cartsNeeded(total);
  if (carts > cartsFree(c)) return toast(`Needs ${carts} ${CART[S.faction].name}, only ${cartsFree(c)} free`, 'bad');
  const p = pathFrom(c, dest.x, dest.y);
  if (!isFinite(p.cost)) return toast('No road to that city', 'bad');
  RES.forEach(r => { c.res[r] -= amt[r]; });
  pushTrade(c, { kind: 'send', toCity: dest.id, tName: dest.name, res: amt, carts, path: p }, Date.now());

}
function sendBarter() {

  const give = UI.mkt.give, get = UI.mkt.get;

  const amt = Math.min(Math.floor(+UI.mkt.amt || 0), Math.floor(c.res[give]));

  const tgt = barterTarget(c, fac);

function tradeEvent(id, t) {
  const tr = S.trades.find(x => x.id === id);
  if (!tr) return;
  const home = cityById(tr.fromCity) || capital();
  if (tr.phase === 'out') {
    tr.phase = 'back'; tr.arrive = t; tr.returnAt = t + tr.travel;
    if (tr.kind === 'send') {
      const dest = cityById(tr.toCity);
      if (!dest) { tr.carry = tr.res; return; }
      const cap = caps(dest);
      let lost = 0;
      RES.forEach(r => {
        const lim = r === 'crop' ? cap.gr : cap.wh;
        const room = Math.max(0, lim - dest.res[r]);
        const put = Math.min(room, tr.res[r] || 0);
        dest.res[r] += put;
        lost += (tr.res[r] || 0) - put;
      });
      tr.carry = null;
      if (lost > 0) addReport('info', `${dest.name}: storehouses overflowed`, `🛒 A shipment from ${esc(home.name)} arrived but ${fmt(lost)} resources did not fit and were lost. Upgrade the Warehouse/Granary of ${esc(dest.name)}.`, t);

      } else {
        tr.carry = tr.get;
        changeRel(tr.fac, 1, 'barter', 'Barter with you', 3, 15);
      }
    }
  } else {
    if (tr.carry) {
      const cap = caps(home);
      RES.forEach(r => { if (tr.carry[r]) home.res[r] = Math.min(r === 'crop' ? cap.gr : cap.wh, home.res[r] + tr.carry[r]); });
      if (tr.kind === 'barter' && tr.carry === tr.get) {
        addReport('info', `Trade with the ${FACS[tr.fac].name} completed`, `🛒 Your caravan returned to ${esc(home.name)} with ${resTxt(tr.get)}.`, t);
        toast(`🛒 Caravan returned to ${home.name}`, 'good');
      }
    }

  }
}
function autoSupply() {
  S.cities.forEach(c => {
    if (!c.supplyTo || c.bld.market < 1) return;
    const dest = cityById(c.supplyTo);
    if (!dest || dest.id === c.id) { c.supplyTo = null; return; }
    const free = cartsFree(c);
    if (!free) return;
    const capacity = free * CART[S.faction].cap;
    const sc = caps(c), dc = caps(dest);
    const amt = {};
    RES.forEach(r => {
      const keep = 0.35 * (r === 'crop' ? sc.gr : sc.wh);
      const surplus = Math.max(0, c.res[r] - keep);
      const need = Math.max(0, (r === 'crop' ? dc.gr : dc.wh) * 0.9 - dest.res[r] - incomingTrade(dest, r));
      amt[r] = Math.floor(Math.min(surplus, need));
    });
    let total = sumObj(amt);
    if (total > capacity) { const f = capacity / total; RES.forEach(r => { amt[r] = Math.floor(amt[r] * f); }); total = sumObj(amt); }
    if (total < 150) return;
    const p = pathFrom(c, dest.x, dest.y);
    if (!isFinite(p.cost)) return;
    RES.forEach(r => { c.res[r] -= amt[r]; });
    pushTrade(c, { kind: 'send', toCity: dest.id, tName: dest.name, res: amt, carts: cartsNeeded(total), path: p, auto: true }, S.time);
  });
}

const ISO = { k: 0.62, cx: 180, cy: 168 };

const STYLE = {

const ART = { night: 0, st: null };
function stl() { return STYLE[S.faction]; }
function winCol() { return ART.night > 0.45 ? ART.st.glow : '#2a1d12'; }

function isoBox(x, y, a, b, h, col, z0) {
  z0 = z0 || 0;
  const p = (dx, dy, z) => P(x + dx, y + dy, z0 + z);
  return pg([p(a, -b, 0), p(a, b, 0), p(a, b, h), p(a, -b, h)], shade(col, 0.7)) +
    pg([p(-a, b, 0), p(a, b, 0), p(a, b, h), p(-a, b, h)], shade(col, 0.93)) +
    pg([p(-a, -b, h), p(a, -b, h), p(a, b, h), p(-a, b, h)], shade(col, 1.14));
}
function roofGable(x, y, a, b, h, rh, col, z0, alongY) {

  const A = a + 1.5, B = b + 1.5;

    pg([p(-A, B, h), p(A, B, h), p(A, 0, h + rh), p(-A, 0, h + rh)], shade(col, 1.05)) +
    pg([p(a, -b, h), p(a, b, h), p(a, 0, h + rh)], shade(col, 0.62));

    pg([p(A, -B, h), p(A, B, h), p(0, B, h + rh), p(0, -B, h + rh)], shade(col, 0.7)) +
    pg([p(-a, b, h), p(a, b, h), p(0, b, h + rh)], shade(col, 1.02));
}
function roofPyr(x, y, a, b, h, rh, col, z0) {

function isoCyl(x, y, r, h, col, z0) {

    `<path d="M${F1(cx)},${F1(ty + ry)} L${F1(cx)},${F1(cy + ry)} A${F1(rx)},${F1(ry)} 0 0 0 ${F1(cx + rx)},${F1(cy)} L${F1(cx + rx)},${F1(ty)} A${F1(rx)},${F1(ry)} 0 0 1 ${F1(cx)},${F1(ty + ry)} Z" fill="${shade(col, 0.72)}"/>` +

function isoCone(x, y, r, z, ch, col) {

function merlons(x, y, a, b, h, col, z0, step) {

  for (let d = -a + 1.5; d <= a - 1; d += step) { front += isoBox(x + d, y + b - 1, 1.1, 1.1, 2.6, col, (z0 || 0) + h); }

function spikes(x, y, a, b, z) {

function windowsL(x, y, a, b, h, z0) {
  let s = '';
  const n = Math.max(1, Math.floor(a / 5));
  for (let i = 0; i < n; i++) {
    const x1 = -a + (2 * a) * (i + 0.3) / n, x2 = x1 + Math.min(2.5, a / n * 0.8);
    for (let fl = 0; fl < Math.max(1, Math.floor(h / 9)); fl++) {

function beams(x, y, a, b, h, z0) {

function flagP(x, y, z, len, col) {

function smokeP(x, y, z) {

/* ----- faction-styled parts ----- */
function partHouse(o) {
  const st = ART.st;
  const z0 = o.z || 0;
  const wall = o.col || (st.key === 'greenskins' ? st.wood : st.wall);
  const roof = o.roofCol || st.roof;
  let s = isoBox(o.x, o.y, o.a, o.b, o.h, wall, z0);
  if (st.key === 'empire' && !o.col) s += beams(o.x, o.y, o.a, o.b, o.h, z0);
  if (st.key === 'elves' && !o.col) s += isoBox(o.x, o.y, o.a + 0.3, o.b + 0.3, 1.2, st.trim, z0 + o.h - 1.2);
  if (o.win !== false) s += windowsL(o.x, o.y, o.a, o.b, o.h, z0);
  const rh = o.rh == null ? Math.min(o.a, o.b) * 0.9 : o.rh;
  if (o.roof === 'flat') s += merlons(o.x, o.y, o.a, o.b, o.h, st.key === 'greenskins' ? st.wood : st.stone, z0);
  else if (st.key === 'elves' || o.roof === 'pyr') s += roofPyr(o.x, o.y, o.a, o.b, o.h + z0, rh * (st.key === 'elves' ? 1.5 : 1), roof);
  else s += roofGable(o.x, o.y, o.a, o.b, o.h + z0, rh, roof, 0, o.alongY);
  if (st.key === 'greenskins' && o.roof !== 'flat') s += spikes(o.x, o.y, o.a, o.b, o.h + z0 + 0.5);
  if (o.chim) { s += isoBox(o.x + o.a * 0.4, o.y - o.b * 0.4, 1.6, 1.6, o.h + rh * 0.9, st.stone, z0); s += smokeP(o.x + o.a * 0.4, o.y - o.b * 0.4, z0 + o.h + rh * 0.9 + 1); }
  return s;
}
function partTower(o) {
  const st = ART.st;
  const z0 = o.z || 0;
  let s = '';
  if (st.key === 'elves') {
    s += isoCyl(o.x, o.y, o.r, o.h, o.col || st.wall, z0);
    s += isoCyl(o.x, o.y, o.r * 1.08, 1.3, st.trim, z0 + o.h - 1.3);
    const [wx, wy] = P(o.x + o.r * 0.7, o.y + o.r * 0.7, z0 + o.h * 0.6);
    s += `<rect x="${F1(wx - 0.8)}" y="${F1(wy - 3)}" width="1.6" height="4" fill="${winCol()}"/>`;
    if (o.cap !== 'fire') s += isoCone(o.x, o.y, o.r * 1.25, z0 + o.h, o.r * 3, o.roofCol || st.roof);
  } else if (st.key === 'greenskins') {
    const r = o.r * 0.85;
    s += isoBox(o.x, o.y, r, r, o.h, o.col || st.wood, z0);
    s += isoBox(o.x, o.y, r * 1.45, r * 1.45, 2, st.wood, z0 + o.h);
    s += spikes(o.x, o.y, r * 1.45, r * 1.45, z0 + o.h + 2);
    if (o.cap === 'roof') s += roofPyr(o.x, o.y, r * 1.2, r * 1.2, z0 + o.h + 2, r * 1.6, st.roof2);
  } else {
    s += isoBox(o.x, o.y, o.r, o.r, o.h, o.col || st.stone, z0);
    s += windowsL(o.x, o.y, o.r, o.r, o.h, z0);
    if (o.cap === 'roof') s += roofPyr(o.x, o.y, o.r, o.r, z0 + o.h, o.r * 2.2, st.roof2);
    else s += merlons(o.x, o.y, o.r, o.r, o.h, o.col || st.stone, z0, 3.5);
  }
  if (o.cap === 'fire') s += fireP(o.x, o.y, z0 + o.h + (st.key === 'greenskins' ? 2 : 2.6), 2.5);
  if (o.flag) s += flagP(o.x, o.y, z0 + o.h + (o.cap === 'roof' ? o.r * 2 : 3), 10, o.flag === 2 ? st.flag2 : st.flag);
  return s;
}
function partSilo(o) {

function partStall(o) {

  let s = isoBox(o.x, o.y, 4, 3, 3.5, st.wood);
  s += isoBox(o.x + 3.6, o.y - 2.6, 0.4, 0.4, 8, st.wood) + isoBox(o.x - 3.6, o.y + 2.6, 0.4, 0.4, 8, st.wood) + isoBox(o.x + 3.6, o.y + 2.6, 0.4, 0.4, 8, st.wood);

function partCrates(o) {

function partFence(o) {

  const L = (p1, p2) => `<line x1="${F1(p1[0])}" y1="${F1(p1[1])}" x2="${F1(p2[0])}" y2="${F1(p2[1])}" stroke="#5b3b1f" stroke-width="0.9"/>`;
  s += L(p(-o.a, o.b, 2.5), p(o.a, o.b, 2.5)) + L(p(o.a, -o.b, 2.5), p(o.a, o.b, 2.5)) + L(p(-o.a, o.b, 1), p(o.a, o.b, 1)) + L(p(o.a, -o.b, 1), p(o.a, o.b, 1));

function partHorse(o) {

  const c = o.col || '#6b4626';
  return `<ellipse cx="${F1(x)}" cy="${F1(y - 3)}" rx="3" ry="1.6" fill="${c}"/><rect x="${F1(x + 1.8)}" y="${F1(y - 6)}" width="1.4" height="3" fill="${c}"/><line x1="${F1(x - 2)}" y1="${F1(y - 2)}" x2="${F1(x - 2)}" y2="${F1(y)}" stroke="${c}"/><line x1="${F1(x + 2)}" y1="${F1(y - 2)}" x2="${F1(x + 2)}" y2="${F1(y)}" stroke="${c}"/>`;

function partTree(o) {
  const [x, y] = P(o.x, o.y, 0);
  const h = (o.h || 12) * ISO.k, w = (o.w || 4.5);
  const key = ART.st.key;
  const leaf = o.dead ? '#4a3a2a' : key === 'elves' ? '#4f8f4a' : key === 'greenskins' ? '#3f5a28' : '#2f5a2a';
  if (o.round) return `<rect x="${F1(x - 0.7)}" y="${F1(y - h * 0.5)}" width="1.4" height="${F1(h * 0.5)}" fill="#4a3020"/><circle cx="${F1(x)}" cy="${F1(y - h * 0.65)}" r="${F1(w)}" fill="${leaf}"/><circle cx="${F1(x - w * 0.3)}" cy="${F1(y - h * 0.75)}" r="${F1(w * 0.5)}" fill="${shade(leaf, 1.25)}"/>`;
  return `<rect x="${F1(x - 0.6)}" y="${F1(y - 2.5)}" width="1.2" height="2.5" fill="#4a3020"/>` + pg([[x - w, y - 2], [x + w, y - 2], [x, y - h]], leaf) + pg([[x, y - 2], [x + w, y - 2], [x, y - h]], shade(leaf, 0.75));

  const rx = o.r * ISO.k * 1.4, ry = o.r * ISO.k * 0.9;
  return `<path d="M${F1(x - rx)},${F1(y)} A${F1(rx)},${F1(ry)} 0 0 1 ${F1(x + rx)},${F1(y)} Z" fill="${o.col || '#5a4a30'}"/><path d="M${F1(x - rx * 0.1)},${F1(y)} A${F1(rx * 0.9)},${F1(ry * 0.85)} 0 0 1 ${F1(x + rx)},${F1(y)} Z" fill="#00000030"/>` +
    `<path d="M${F1(x - 2.5)},${F1(y)} v-3.5 a2.5,2.5 0 0 1 5,0 v3.5 Z" fill="#1a110a" stroke="${o.trim || '#8a7a5a'}" stroke-width=".8"/>`;

function partIdol(o) {
  const st = ART.st;
  const h = o.h;
  let s = isoBox(o.x, o.y, o.a, o.a, h, st.stone);
  const [ex, ey] = P(o.x + o.a * 0.2, o.y + o.a, h * 0.72);
  s += `<circle cx="${F1(ex - 2)}" cy="${F1(ey)}" r="1" fill="#ff3a1a"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="${F1(ex + 1.5)}" cy="${F1(ey + 0.8)}" r="1" fill="#ff3a1a"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>`;
  const [mx, my] = P(o.x + o.a * 0.2, o.y + o.a, h * 0.4);
  s += pg([[mx - 3, my], [mx + 2.5, my + 1.2], [mx + 2, my + 2.4], [mx - 3, my + 1.4]], '#2a1a10');
  s += spikes(o.x, o.y, o.a, o.a, h);

function wallPieces(t) {
  const st = ART.st;
  const out = [];
  if (t <= 0) return out;
  const R = WALL_R;
  const seg = 22;
  const h = t === 1 ? 9 : t === 2 ? 11 : t === 3 ? 13 : 16;
  const col = st.key === 'greenskins' ? st.wood : st.key === 'elves' ? st.wall : st.stone;
  const edges = [
    { fx: s => [s, -R], along: 'x' }, { fx: s => [-R, s], along: 'y' },
    { fx: s => [R, s], along: 'y' }, { fx: s => [s, R], along: 'x' }
  ];
  edges.forEach(e => {
    for (let s = -R + seg / 2; s < R; s += seg) {
      const [x, y] = e.fx(s);
      if (e.along === 'x' && y === R && Math.abs(x) < seg && t >= 3) continue; // gate gap
      let svg = '';
      if (t === 1) {
        for (let d = -seg / 2; d < seg / 2; d += 3.2) {
          const px = e.along === 'x' ? x + d : x, py = e.along === 'y' ? y + d : y;
          svg += isoBox(px, py, 1, 1, h, st.wood);
          if (st.key === 'greenskins') { const [tx, ty] = P(px, py, h); svg += pg([[tx - 1, ty], [tx + 1, ty], [tx, ty - 3]], '#e2d9bf'); }
        }
      } else {
        const a = e.along === 'x' ? seg / 2 : 2.4, b = e.along === 'y' ? seg / 2 : 2.4;
        svg += isoBox(x, y, a, b, h, col);
        if (st.key === 'greenskins') svg += spikes(x, y, a, b, h);
        else svg += merlons(x, y, a, b, h, col, 0, 4);
      }
      out.push({ d: x + y, svg });
    }
  });
  if (t >= 3) {
    const corners = [[-R, -R], [R, -R], [-R, R], [R, R]];
    if (t >= 4) corners.push([0, -R], [-R, 0], [R, 0]);
    corners.forEach(([x, y]) => out.push({ d: x + y + 0.5, svg: partTower({ x, y, r: t >= 4 ? 6.5 : 5.5, h: h + (t >= 4 ? 12 : 8), cap: st.key === 'empire' && t < 4 ? null : 'roof', flag: t >= 4 ? 1 : 0 }) }));
    out.push({ d: R + 0.5, svg: partTower({ x: -12, y: R, r: 5.5, h: h + 8, flag: 2 }) + partTower({ x: 12, y: R, r: 5.5, h: h + 8, flag: 2 }) + isoBox(0, R, 7, 2.6, h + 2, col) + pg([P(-3, R + 2.6, 0), P(3, R + 2.6, 0), P(3, R + 2.6, h - 3), P(-3, R + 2.6, h - 3)], '#1a110a') });
  }
  return out;
}

function fieldsSceneSVG(c) {

  for (let i = 0; i < 60; i++) {

    const [px, py] = P(x, y, 0);
    s += `<ellipse cx="${F1(px)}" cy="${F1(py)}" rx="${F1(2 + hash2(i, 3, 88) * 5)}" ry="${F1(1 + hash2(i, 4, 88) * 2)}" fill="${st.grass2}" opacity=".6"/>`;

  slots.forEach(([x, y]) => { const a = P(0, 0, 0), b = P(x, y, 0); s += `<line x1="${F1(a[0])}" y1="${F1(a[1])}" x2="${F1(b[0])}" y2="${F1(b[1])}" stroke="${st.path}" stroke-width="3" stroke-linecap="round" opacity=".55"/>`; });
  const items = [];
  // mini town in the centre
  const kt = Math.max(1, bldTier(c, 'keep'));
  const town = [];
  town.push({ k: 'house', x: -12, y: -4, a: 5, b: 4, h: 6 }, { k: 'house', x: 4, y: -12, a: 4, b: 5, h: 6 }, { k: 'house', x: 10, y: 6, a: 5, b: 4, h: 6 }, { k: 'house', x: -4, y: 12, a: 4, b: 4, h: 6 });
  town.push({ k: 'tower', x: 0, y: 0, r: 4 + kt, h: 14 + kt * 6, cap: 'roof', flag: 1 });

  s += sceneOverlays(c, 'f', W, Hh);
  return `<svg class="scene" viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

const RAR_W = { 1: [70, 26, 4, 0], 2: [50, 38, 10, 2], 3: [30, 44, 20, 6], 4: [15, 40, 32, 13], 5: [5, 35, 40, 20] };

function itemVal(slot, r) { const m = RARITY[r].m; return slot === 'weapon' ? 0.03 * m : slot === 'armour' ? 0.08 * m : slot === 'banner' ? 0.03 * m : 0.05 * m; }

function genItem(r, slot) {

  const bases = ITEM_BASE[slot][S.faction];
  const name = slot === 'mount' ? bases[r] : pick(ITEM_PREFIX[r]) + ' ' + pick(bases);
  const it = { id: S.nextId++, slot, r, name, val: itemVal(slot, r), heroId: null };
  S.items.push(it);

}
function rollRarity(diff) { return weightedPick([0, 1, 2, 3], RAR_W[clamp(diff, 1, 5)]); }
function heroItem(h, slot) { return h ? S.items.find(i => i.heroId === h.id && i.slot === slot) : null; }
function itemVal0(h, slot) { const it = heroItem(h, slot); return it ? it.val : 0; }

function salvageValue(it) { return 200 * Math.pow(it.r + 1, 2); }
function equipItem(itemId, heroId) {

function unequipItem(itemId) { const it = S.items.find(i => i.id === itemId); if (!it) return; it.heroId = null; save(); refreshModal(true); rerender(); }
function salvageItem(itemId) {
