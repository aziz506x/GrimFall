<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimfall">
<meta name="theme-color" content="#0b0908">
<title>Grimfall — Dominion of the Old World</title>
<style>
:root{
  --bg:#0b0908;--panel:#16110e;--panel2:#211913;--line:#3b2c1d;--line2:#5a4128;
  --gold:#d4a84b;--gold2:#f2d27e;--bronze:#9a6532;--text:#ecdfc6;--muted:#9b8a70;
  --red:#d0493a;--green:#86b84f;--blue:#6b9bc7;--purple:#a65bd0;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% -10%,#2a1c12 0%,#0b0908 55%) fixed;min-height:100vh;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:var(--serif);color:var(--gold);margin:0 0 8px;font-weight:700;letter-spacing:.04em}
h2{font-size:17px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
h3{font-size:15px}
h4{font-size:13px;color:var(--gold2);margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.neg{color:var(--red)}.pos{color:var(--green)}
b.up{color:var(--green)}

/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(var(--safe-t) + 6px) 8px 6px;background:linear-gradient(#140f0b,#0d0a08);border-bottom:1px solid var(--line2);box-shadow:0 6px 18px #000c}
.hrow{display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto 6px}
.crest{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:radial-gradient(#3a2a1a,#1a120c);border:1px solid var(--gold);box-shadow:0 0 10px #d4a84b44}
.vn{flex:1;min-width:0}
.vn .t{font-family:var(--serif);color:var(--gold2);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vn .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:#1d1510;border:1px solid var(--line2);color:var(--gold);border-radius:9px;height:34px;min-width:34px;padding:0 9px;font-size:14px;font-weight:700;font-family:inherit}
.hbtn.on{background:#3a2814;border-color:var(--gold2);color:var(--gold2)}
.resbar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:900px;margin:0 auto}
.rc{background:#1a130e;border:1px solid var(--line);border-radius:8px;padding:4px 5px 4px;min-width:0;cursor:pointer}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:2px}
.rtop span{font-size:13px}
.rtop b{font-variant-numeric:tabular-nums;font-size:13px}
.rbar{height:4px;background:#000;border-radius:3px;overflow:hidden;margin:3px 0 2px}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bronze),var(--gold));transition:width .5s}
.rbar i.full{background:linear-gradient(90deg,#8a2a1e,var(--red))}
.rrate{font-size:10.5px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rrate.bad{color:var(--red)}
.rsub{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{max-width:900px;margin:6px auto 0;background:linear-gradient(90deg,#4a1510,#2a0d0a);border:1px solid var(--red);color:#ffd9cf;border-radius:8px;padding:6px 10px;font-size:12.5px;display:flex;align-items:center;gap:8px;animation:throb 1.4s infinite;cursor:pointer}
@keyframes throb{50%{box-shadow:0 0 14px #d0493a99}}

/* Main + nav */
main{padding:150px 10px calc(84px + var(--safe-b));max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:linear-gradient(#120d0a,#0a0706);border-top:1px solid var(--line2);padding:4px 4px calc(4px + var(--safe-b))}
nav button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:10.5px;position:relative;border-radius:10px;font-family:inherit}
nav button .i{font-size:20px;filter:grayscale(.6)}
nav button.on{color:var(--gold2);background:#2a1d12}
nav button.on .i{filter:none}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px;line-height:16px}

/* Panels */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:inset 0 1px 0 #ffffff0a,0 4px 14px #0007}
.btn{appearance:none;-webkit-appearance:none;background:linear-gradient(#c4923a,#7d5421);color:#1b1006;font-weight:800;border:1px solid #e8c26a;border-radius:10px;padding:10px 14px;min-height:42px;font-size:14px;font-family:inherit;cursor:pointer;text-shadow:0 1px 0 #f3d38a66}
.btn:active{transform:translateY(1px)}
.btn[disabled]{filter:grayscale(1);opacity:.45}
.btn.full{width:100%;margin-top:8px}
.btn.ghost{background:#1d1510;color:var(--gold);border-color:var(--line2);text-shadow:none}
.btn.ghost.on{border-color:var(--gold2);color:var(--gold2);background:#2e2014}
.btn.red{background:linear-gradient(#b83a2c,#6d1d15);border-color:#e66a5a;color:#fff;text-shadow:none}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.costs{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{background:#0f0b08;border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:12.5px;font-variant-numeric:tabular-nums}
.chip.lack{border-color:var(--red);color:#ff9c8f}
.meta{font-size:12.5px;color:var(--muted)}
.eff{display:flex;flex-direction:column;gap:2px;font-size:13px;margin:4px 0}
.note{font-size:12.5px;background:#0f0b08;border:1px dashed var(--line2);border-radius:8px;padding:8px;color:var(--muted)}
.note.bad{border-color:var(--red);color:#ffb3a8}
.note.good{border-color:var(--green);color:#cfe8b5}
.prog{height:8px;background:#000;border-radius:5px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bronze),var(--gold2))}
.prog.red i{background:linear-gradient(90deg,#7a1e15,var(--red))}
.qitem{display:flex;align-items:center;gap:10px}
.qicon{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#0f0b08;border:1px solid var(--line);border-radius:10px;flex-shrink:0}
.cd{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:700}
.st{display:inline-block;font-size:10.5px;font-weight:800;border-radius:8px;padding:1px 7px;border:1px solid;vertical-align:middle;letter-spacing:.03em}
.st.war{color:#ff9c8f;border-color:var(--red);background:#2a0e0a}
.st.neutral{color:var(--muted);border-color:var(--line2);background:#16110d}
.st.allied{color:#cfe8b5;border-color:var(--green);background:#14200d}
.relbar{position:relative;height:6px;border-radius:4px;background:linear-gradient(90deg,#5a1a12,#2a2018 50%,#1f3a14);margin-top:5px}
.relbar i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;background:var(--gold2);box-shadow:0 0 6px #000}

/* Village */
.hero{display:flex;gap:12px;align-items:center}
.hero .big{font-size:40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stats.s3{grid-template-columns:repeat(3,1fr)}
.stat{background:#0f0b08;border:1px solid var(--line);border-radius:8px;padding:6px 3px;text-align:center}
.stat b{display:block;color:var(--gold2);font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fgrid.f4{grid-template-columns:repeat(4,1fr);gap:6px}.fgrid.f4 .tn{display:none}.fgrid.f4 .tile{padding-left:2px;padding-right:2px}
.techbr{border:1px solid var(--line2);border-radius:12px;padding:8px;margin-bottom:10px}.techhd{font-weight:700;color:var(--gold);margin-bottom:4px}
.technode{display:flex;gap:8px;padding:8px 4px;position:relative;border-top:1px solid #ffffff0d}.technode:first-of-type{border-top:0}
.technode .tnic{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid var(--line2);background:#0b0806}
.technode.done .tnic{border-color:var(--green)}.technode.busy .tnic{border-color:var(--gold)}.technode.open .tnic{border-color:var(--gold2)}.technode.lock{opacity:.55}
.fhead{display:flex;align-items:center;gap:6px;font-size:13px;margin:12px 0 6px}.fhead:first-of-type{margin-top:4px}.fhead .sp{flex:1}
@media(min-width:560px){.fgrid{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;border-radius:12px;border:1px solid var(--line);padding:8px 4px 6px;text-align:center;cursor:pointer;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 0 18px #0008}
.tile .ti{font-size:28px;line-height:1}
.tile .tn{font-size:11px;color:var(--text);opacity:.9}
.tile .tp{font-size:10.5px;color:var(--green)}
.tile .lv{position:absolute;top:4px;right:5px;background:#0b0806;border:1px solid var(--gold);color:var(--gold2);font-size:11px;font-weight:800;border-radius:10px;min-width:20px;padding:0 4px;line-height:18px}
.tile .ok{position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.tile.timber{background:linear-gradient(160deg,#1f2a16,#121009)}
.tile.clay{background:linear-gradient(160deg,#3a2215,#120c08)}
.tile.iron{background:linear-gradient(160deg,#252a31,#0f0e0d)}
.tile.crop{background:linear-gradient(160deg,#3b3214,#120f08)}
.tile.bld{background:linear-gradient(160deg,#2a1f15,#100c09)}
.tile.busy{border-color:var(--gold);animation:busy 1.6s infinite}
@keyframes busy{50%{box-shadow:0 0 14px #d4a84b88,inset 0 0 18px #0008}}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:560px){.bgrid{grid-template-columns:repeat(8,1fr)}}
.bgrid .tile{min-height:78px}

/* Building cards */
.bcard{display:flex;gap:10px}
.bcard .qicon{width:52px;height:52px;font-size:30px}
.bcard .bc{flex:1;min-width:0}
.lvtag{display:inline-block;background:#0b0806;border:1px solid var(--gold);color:var(--gold2);font-size:11px;font-weight:800;border-radius:10px;padding:0 7px;margin-left:4px;vertical-align:middle}
.desc{font-size:12.5px;color:var(--muted);margin:2px 0 4px}

/* Units */
.ugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}
.ugrid div{background:#0f0b08;border:1px solid var(--line);border-radius:7px;padding:4px;text-align:center;font-size:11px;color:var(--muted)}
.ugrid b{display:block;color:var(--text);font-size:14px}
.role{font-size:10.5px;border:1px solid var(--line2);border-radius:8px;padding:1px 6px;color:var(--gold);margin-left:4px}
.tagc{color:var(--text);opacity:.85}.tagi{font-size:12px;opacity:.85}
.simrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #ffffff0d}.simrow .nm{flex:1;min-width:0;font-size:13px}.simrow input{width:72px;text-align:center;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:8px;height:36px;font-size:16px}
.simsel{width:100%;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px;font:inherit;margin-bottom:6px}
.simgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.simgrid label{font-size:12px;color:var(--muted,#a99)}
.odds{font-size:17px;font-weight:700;text-align:center;margin:6px 0}
.stepper{display:flex;align-items:center;gap:6px;margin-top:6px}
.stepper input{width:72px;text-align:center;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:9px;height:40px;font-size:16px;font-weight:700}
.stepper .hbtn{height:40px;min-width:40px;font-size:18px}
.locked{opacity:.55}

/* Map */
.maptools{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#mapBox{position:relative;height:58vh;min-height:300px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#050403;touch-action:none}
#mapCv{display:block;touch-action:none;cursor:grab}
#miniCv{position:absolute;right:6px;bottom:6px;width:122px;height:122px;border:1px solid var(--gold);border-radius:6px;background:#050403;box-shadow:0 4px 14px #000;opacity:.92;touch-action:none}
#mapInfo{position:absolute;left:6px;top:6px;background:#0b0806d9;border:1px solid var(--line2);border-radius:8px;padding:4px 8px;font-size:11.5px;color:var(--text);pointer-events:none;max-width:70%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin:8px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.listrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff0a;cursor:pointer}
.listrow:last-child{border-bottom:0}
.mode{display:flex;gap:6px;margin:8px 0}
.mode button{flex:1}
.mode button.on{background:linear-gradient(#c4923a,#7d5421);color:#1b1006;border-color:#e8c26a}
.sendrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff0a}
.sendrow .nm{flex:1;min-width:0;font-size:13px}
.sendrow input{width:66px;text-align:center;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:8px;height:36px;font-size:16px}
.facrow{padding:10px 0;border-bottom:1px solid #ffffff0a}
.facrow:last-child{border-bottom:0}

/* Reports */
.filters{display:flex;gap:6px;margin-bottom:10px}
.filters button{flex:1}
.rep{border-bottom:1px solid #ffffff0a;padding:9px 0;cursor:pointer}
.rep:last-child{border-bottom:0}
.rep .rh{display:flex;gap:10px;align-items:center}
.rep .ri{font-size:20px;width:30px;text-align:center}
.rep .rt1{flex:1;min-width:0;font-weight:600}
.rep.unread .rt1{color:var(--gold2)}
.rep .when{font-size:11px;color:var(--muted);white-space:nowrap}
.rbody{margin-top:8px;padding:10px;background:#0d0a08;border:1px solid var(--line);border-radius:9px;font-size:13px;cursor:auto}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
table.rt th{color:var(--muted);font-weight:600;text-align:left;border-bottom:1px solid var(--line);padding:3px}
table.rt td{padding:3px;border-bottom:1px solid #ffffff08;font-variant-numeric:tabular-nums}
table.rt td:not(:first-child),table.rt th:not(:first-child){text-align:right}
.bstats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bstats div{background:#16110d;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.bstats b{display:block;font-size:16px;color:var(--gold2)}
.bstats small{color:var(--muted);font-size:10.5px}
.loot{margin-top:8px;color:var(--gold2)}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;background:#000b;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#241a12,#120d0a);border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + var(--safe-b));box-shadow:0 -10px 40px #000;animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line2)}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:-4px auto 10px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.shead .qicon{width:50px;height:50px;font-size:30px}
.shead .x{margin-left:auto}

/* Toast */
#toasts{position:fixed;left:0;right:0;bottom:calc(78px + var(--safe-b));z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:#1d1510ee;border:1px solid var(--gold);color:var(--text);padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px #000;animation:up .2s;max-width:440px;text-align:center}
.toast.bad{border-color:var(--red);background:#2a0e0aee}
.toast.good{border-color:var(--green)}

/* Start screen */
#start{position:fixed;inset:0;z-index:40;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#3a2210 0%,#0b0908 60%);padding:calc(var(--safe-t) + 20px) 14px calc(30px + var(--safe-b))}
.st-in{max-width:760px;margin:0 auto;text-align:center}
.title{font-family:var(--serif);font-size:44px;letter-spacing:.14em;color:var(--gold2);text-shadow:0 0 22px #d4a84b66,0 2px 0 #5a3a12;margin-top:10px}
.subtitle{font-family:var(--serif);color:var(--gold);letter-spacing:.3em;text-transform:uppercase;font-size:12px}
.lore{color:var(--muted);font-size:13.5px;margin:14px auto 18px;max-width:520px;font-style:italic;font-family:var(--serif)}
.facs{display:grid;gap:10px;text-align:left}
@media(min-width:700px){.facs{grid-template-columns:repeat(3,1fr)}}
.fac{background:linear-gradient(180deg,#221911,#120d0a);border:1px solid var(--line2);border-radius:14px;padding:14px;cursor:pointer;transition:transform .15s}
.fac.sel{border-color:var(--gold2);box-shadow:0 0 0 2px #d4a84b55,0 0 24px #d4a84b44;transform:translateY(-2px)}
.fac .fi{font-size:36px}
.fac h3{margin:4px 0 2px;font-size:18px}
.fac .perk{color:var(--green);font-size:12.5px;font-weight:600;margin-bottom:6px}
.fac ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
.namein{margin:18px auto 8px;max-width:360px;text-align:left}
.namein label{font-size:12px;color:var(--muted)}
.namein input{width:100%;margin-top:4px;background:#0b0806;border:1px solid var(--line2);color:var(--text);border-radius:10px;height:44px;padding:0 12px;font-size:16px;font-family:var(--serif)}
.btn.big{font-size:17px;padding:14px 26px;margin-top:8px;font-family:var(--serif);letter-spacing:.06em}
.speeds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.speeds button.on{background:linear-gradient(#c4923a,#7d5421);color:#1b1006;border-color:#e8c26a}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff0a;font-size:13px}
.kv span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.segs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.segs button{flex:1 0 auto;white-space:nowrap}
textarea.code{width:100%;height:130px;background:#0b0806;color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:8px;font:11px/1.3 ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text;word-break:break-all}
.hp{height:7px;background:#000;border-radius:4px;overflow:hidden;margin-top:3px;border:1px solid var(--line)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#8a2a1e,#86b84f)}
.hp.xp i{background:linear-gradient(90deg,#3a5a8a,#7fb6d6)}

.check input{width:20px;height:20px;accent-color:#d4a84b;flex-shrink:0}
.vn{cursor:pointer}
nav button{font-size:10px}
.scenewrap{margin:0 -4px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#0b0908}
.scene{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}
.scene polygon{stroke:#1a120b;stroke-width:.35;stroke-linejoin:round}

  let aTot = 0, dTot = 0;
  attackers.forEach(a => { const v = a.n * a.att; aTot += v; aSh[tg(a)] += v; });
  defenders.forEach(d => { const v = d.n * (d.di + d.dc) / 2; dTot += v; dSh[tg(d)] += v; });
  TAG_KEYS.forEach(k => { aSh[k] = aTot > 0 ? aSh[k] / aTot : 0; dSh[k] = dTot > 0 ? dSh[k] / dTot : 0; });
  const dLarge = dSh.cav + dSh.monster, aLarge = aSh.cav + aSh.monster;
  const ab = { antilarge: 0.5 * dLarge, cav: 0.25 * dSh.ranged, monster: 0.25 * (dSh.inf + dSh.ranged + dSh.siege) };
  const db = { antilarge: 0.5 * aLarge, ranged: (o.wall || 0) > 0 ? 0.3 : 0 };
  let infA = 0, cavA = 0;
  attackers.forEach(a => { const v = a.n * a.att * (1 + (ab[tg(a)] || 0)); if (a.cls === 'cav') cavA += v; else infA += v; });
  const raw = infA + cavA;
  const luck = o.luck || 1;
  const A = raw * luck * (o.attMult || 1);
  const pi = raw > 0 ? infA / raw : 1, pc = raw > 0 ? cavA / raw : 0;
  let defRaw = 0, defPlain = 0;
  defenders.forEach(d => { const v = d.n * (d.di * pi + d.dc * pc); defPlain += v; defRaw += v * (1 + (db[tg(d)] || 0)); });
  const D = (defRaw + o.baseDef) * o.wallMult * (o.defMult || 1);
  const notes = [];
  ['antilarge', 'cav', 'monster'].forEach(k => { if (aSh[k] > 0.02 && ab[k] > 0.01) notes.push({ side: 'atk', tag: k, pct: ab[k], share: aSh[k] }); });
  ['antilarge', 'ranged'].forEach(k => { if (dSh[k] > 0.02 && db[k] > 0.01) notes.push({ side: 'def', tag: k, pct: db[k], share: dSh[k] }); });
  let attWin, attLoss, defLoss;
  if (A <= 0) { attWin = false; attLoss = 1; defLoss = 0; }
  else if (o.mode === 'attack') {
    attWin = A > D;
    if (attWin) { attLoss = Math.pow(D / A, 1.5); defLoss = 1; }
    else { attLoss = 1; defLoss = Math.pow(A / D, 1.5); }
  } else {
    attWin = A > D;
    const x = Math.pow(Math.min(A, D) / Math.max(A, D), 1.5);
    const winLoss = x / (1 + x), loseLoss = 1 / (1 + x);
    if (attWin) { attLoss = winLoss; defLoss = loseLoss; } else { attLoss = loseLoss; defLoss = winLoss; }
  }
  return { A, D, attWin, attLoss: Math.min(1, attLoss), defLoss: Math.min(1, defLoss), luck, notes, aSh, dSh,
    atkBonus: aTot > 0 ? raw / aTot - 1 : 0, defBonus: defPlain > 0 ? defRaw / defPlain - 1 : 0 };
}
/* side: which side of the battle is the player ('atk' or 'def') */
function matchNoteHTML(r, side) {
  if (!r || !r.notes || !r.notes.length) return '';
  const lines = r.notes.map(n => {
    const mine = n.side === side, t = TAG_INFO[n.tag];
    const vs = n.tag === 'antilarge' ? (n.side === 'atk' ? 'vs the defenders\' cavalry & monsters' : 'vs the attackers\' cavalry & monsters') : n.tag === 'ranged' ? 'behind walls' : n.tag === 'cav' ? 'vs ranged' : 'vs infantry';
    return `<span class="${mine ? 'pos' : 'neg'}">${t.icon} ${mine ? 'Your' : 'Enemy'} ${t.name} +${Math.round(n.pct * 100)}% ${n.side === 'atk' ? 'offense' : 'defense'}</span> <span class="muted">${vs}</span>`;
  });
  return `<div class="note small" style="margin-top:8px">🎯 <b>Matchups</b><br>${lines.join('<br>')}</div>`;
}
function distributeLoot(avail, cap) {
  const out = { timber: 0, clay: 0, iron: 0, crop: 0 };
  let left = cap;
  let keys = RES.filter(k => avail[k] > 0.5);
  let guard = 0;
  while (left > 0.5 && keys.length && guard++ < 12) {
    const share = left / keys.length;
    const next = [];
    keys.forEach(k => {
      const take = Math.min(avail[k] - out[k], share);
      out[k] += take; left -= take;
      if (avail[k] - out[k] > 0.5) next.push(k);
    });
    keys = next;
  }
  RES.forEach(k => { out[k] = Math.floor(out[k]); });
  return out;
}
function lootTxt(l) { return RES.map(k => RES_ICON[k] + ' ' + fmt(l[k] || 0)).join('  '); }
function rowsTable(title, rows) {
  if (!rows.length) return `<h4>${title}</h4><div class="muted small">No troops present.</div>`;
  return `<h4>${title}</h4><table class="rt"><tr><th>Unit</th><th>Count</th><th>Lost</th></tr>` +
    rows.map(r => `<tr><td>${r.icon} ${esc(r.name)}</td><td>${fmt(r.n)}</td><td class="${r.lost ? 'neg' : ''}">${r.lost ? '−' + fmt(r.lost) : '0'}</td></tr>`).join('') + '</table>';
}
function battleBody(o) {
  const lk = Math.round((o.luck - 1) * 100);
  return `<div class="bstats"><div><small>Attacker offense</small><b>⚔️ ${fmt(o.A)}</b><small>luck ${lk >= 0 ? '+' : ''}${lk}%${o.atkBonus ? ' · ' + o.atkBonus : ''}</small></div>` +
    `<div><small>Defender defense</small><b>🛡️ ${fmt(o.D)}</b><small>${o.wallTxt}</small></div></div>` +
    rowsTable(o.atkTitle, o.atkRows) + rowsTable(o.defTitle, o.defRows) +
    (o.loot ? `<div class="loot">💰 Plunder: ${lootTxt(o.loot)}</div>` : '') + (o.mnote || '') + (o.extra || '');
}

/* =========================================================
   SIMULATION (event-driven, offline-safe)
   ========================================================= */
function cityTag(c) { return S.cities.length > 1 && c ? c.name + ': ' : ''; }
function advanceTo(t) {
  const dt = t - S.time;
  if (dt <= 0) return;
  const gh = dt * S.speed / 3.6e6;
  S.cities.forEach(c => {
    const g = grossRates(c), cap = caps(c);
    ['timber', 'clay', 'iron'].forEach(k => { if (c.res[k] < cap.wh) c.res[k] = Math.min(cap.wh, c.res[k] + g[k] * gh); });
    const net = g.crop - buildingUpkeep(c) - troopUpkeep(c);
    let crop = c.res.crop + net * gh;
    if (crop < 0) { c.starve = (c.starve || 0) - crop; crop = 0; starveCity(c); }
    else if (net > 0) c.starve = 0;
    if (net >= 0 && c.res.crop >= cap.gr) crop = Math.max(c.res.crop, Math.min(crop, cap.gr));
    else crop = Math.min(cap.gr, crop);
    c.res.crop = crop;
    if (net <= 0) TRAIN_BLD.forEach(([b]) => { const q = c.trainQ[b]; if (q && q.length && q[0].next != null) q[0].next += dt; });
  });
  S.heroes.forEach(h => {
    if (!h.wounded && h.hp < 100 && heroStatus(h) === 'home') h.hp = Math.min(100, h.hp + 5 * gh);
    if (h.wounded && !h.reviveAt) { h.woundG = (h.woundG || 0) + gh; if (h.woundG >= 36) { h.wounded = false; h.hp = 40; h.woundG = 0; addReport('info', `${h.name} has recovered`, `${h.icon} ${esc(h.name)} recovered on their own after ${36} game hours of rest (40% health).`, t); } }
  });
  S.renown += renownRate() * gh;
  processPlans(t);
  settsRegen(gh);
  sitesRegen(gh);
  fxTick(gh);
  S.gameMs += dt * S.speed;
  S.time = t;
  worldTick(gameHours(), gh);
}
function starveCity(c) {
  const list = UNITS[S.faction].slice().sort((a, b) => b.upk - a.upk);
  let guard = 0;
  while (c.starve > 0 && guard++ < 200000) {
    let victim = null, where = null;
    for (const u of list) { if ((c.troops[u.id] || 0) > 0) { victim = u; where = 'home'; break; } }
    if (!victim) {
      for (const m of S.marches) {
        if (m.fromCity !== c.id) continue;
        for (const u of list) { if ((m.units[u.id] || 0) > 0) { victim = u; where = m; break; } }
        if (victim) break;
      }
    }
    if (!victim) { c.starve = 0; break; }
    if (where === 'home') c.troops[victim.id]--;
    else {
      where.units[victim.id]--;
      if (where.units[victim.id] <= 0) delete where.units[victim.id];
      if (!Object.keys(where.units).length && !where.heroId) S.marches = S.marches.filter(x => x !== where);
    }
    c.starve -= victim.upk;
    c.starved[victim.id] = (c.starved[victim.id] || 0) + 1;
  }
  if (c.starve < 0) c.starve = 0;
}
function flushStarve() {
  S.cities.forEach(c => {
    const keys = Object.keys(c.starved || {});
    if (!keys.length) return;
    const rows = keys.map(k => { const u = U(k); return `<div>${u.icon} ${esc(u.name)}: <b class="neg">−${c.starved[k]}</b></div>`; }).join('');
    addReport('loss', `${cityTag(c)}Famine! Troops have starved`, `The granaries of ${esc(c.name)} ran dry while Net Crop was negative. Soldiers deserted or perished:<div style="margin-top:6px">${rows}</div><div class="note" style="margin-top:8px">Upgrade Farmsteads or reduce this city's army.</div>`, S.time);
    toast(`☠️ Famine in ${c.name}!`, 'bad');
    c.starved = {};
  });
}
function nextEvent() {
  let best = null;
  const consider = (t, fn) => { if (t != null && (!best || t < best.t)) best = { t, fn }; };
  S.cities.forEach(c => {
    const cid = c.id;
    c.queues.forEach(q => { const qid = q.qid; consider(q.end, t => completeBuild(cid, qid, t)); });
    TRAIN_BLD.forEach(([b]) => { const q = c.trainQ[b]; if (q && q.length) consider(q[0].next, t => trainTick(cid, b, t)); });
    if (c.smithQ) consider(c.smithQ.end, t => smithDone(cid, t));
    if (c.feast) consider(c.feast.end, t => feastDone(cid, t));
  });
  S.marches.forEach(m => { const id = m.id; consider(m.phase === 'out' ? m.arrive : m.returnAt, t => marchEvent(id, t)); });
  S.incoming.forEach(r => { const id = r.id; consider(r.arrive, t => incomingHits(id, t)); });
  S.heroes.forEach(h => { if (h.reviveAt) { const id = h.id; consider(h.reviveAt, t => reviveDone(id, t)); } });
  (S.agents || []).forEach(a => { if (a.mission) { const id = a.id; consider(a.mission.hit ? a.mission.end : a.mission.hitAt, t => agentEvent(id, t)); } });
  S.trades.forEach(tr => { const id = tr.id; consider(tr.phase === 'out' ? tr.arrive : tr.returnAt, t => tradeEvent(id, t)); });
  if (S.techQ) consider(S.techQ.end, techDone);
  consider(S.nextRaid, spawnRaid);
  return best;
}
function simulate(now) {
  let changed = false, guard = 0;
  UI.quiet = now - S.time > 30000;
  while (guard++ < 40000) {
    const ev = nextEvent();
    if (!ev || ev.t > now) break;
    // step long gaps so world events and production stay on time
    const stepMs = 3.6e6 / S.speed * 2;
    let g2 = 0;
    while (ev.t - S.time > stepMs && g2++ < 20000) advanceTo(S.time + stepMs);
    advanceTo(ev.t);
    ev.fn(ev.t);
    changed = true;
  }
  const stepMs = 3.6e6 / S.speed * 2;
  let g2 = 0;
  while (now - S.time > stepMs && g2++ < 20000) advanceTo(S.time + stepMs);
  advanceTo(now);
  flushStarve();
  UI.quiet = false;
  return changed;
}

/* ----- events ----- */
function completeBuild(cid, qid, t) {
  const c = cityById(cid);
  if (!c) return;
  const q = c.queues.find(x => x.qid === qid);
  if (!q || q.end > t) return;
  const maxL = q.kind === 'field' ? FIELD_MAX : BLD_DEF[q.id].max;
  const tierUp = tierOf(q.to, maxL) > tierOf(q.to - 1, maxL);
  if (q.kind === 'field') c.fields[q.id].lvl = q.to;
  else c.bld[q.id] = q.to;
  c.queues = c.queues.filter(x => x.qid !== qid);
  if (tierUp) {
    c.flash = { id: q.kind === 'field' ? 'f' + q.id : q.id, until: Date.now() + 8000 };
    if (q.to > 1 || q.kind !== 'field') toast(`✨ ${q.name} reached Tier ${roman(tierOf(q.to, maxL))}!`, 'good');
  }
  addReport('build', `${cityTag(c)}${q.name} reached Lv ${q.to}`, `Construction finished in ${esc(c.name)}. ${q.kind === 'field' ? 'Production increased.' : esc(BLD_DEF[q.id].desc)}`, t);
  toast(`🔨 ${cityTag(c)}${q.name} → Lv ${q.to}`, 'good');
}
function trainTick(cid, b, t) {
  const c = cityById(cid);
  if (!c) return;
  const arr = c.trainQ[b];
  const q = arr && arr[0];
  if (!q || q.next == null || q.next > t + 1) return;
  c.troops[q.unit] = (c.troops[q.unit] || 0) + 1;
  q.left--;
  if (q.left > 0) q.next = t + q.each;
  else {
    arr.shift();
    const u = U(q.unit);
    toast(`${u.icon} ${cityTag(c)}${q.total} ${u.name} ready`, 'good');
    if (arr.length) arr[0].next = t + arr[0].each;
  }
}
function reviveDone(id, t) {
  const h = heroById(id);
  if (!h || !h.reviveAt || h.reviveAt > t + 1) return;
  h.wounded = false; h.hp = 100; h.reviveAt = null;
  const c = cityById(h.cityId);
  addReport('info', `${h.name} has recovered`, `${h.icon} ${esc(h.name)} is back on their feet and guards ${esc(c ? c.name : 'your capital')}.`, t);
  toast(`${h.icon} ${h.name} is ready for battle`, 'good');
}
function marchEvent(id, t) {
  const m = S.marches.find(x => x.id === id);
  if (!m) return;
  if (m.phase === 'out') {
    if (m.mode === 'settle') resolveSettle(m, t);
    else if (m.mode === 'adventure') resolveAdventure(m, t);
    else if (m.siteId) resolveSiteAttack(m, t);
    else if (m.mode === 'reinforce') resolveReinforce(m, t);
    else resolveAttack(m, t);
  } else returnHome(m, t);
}
function marchBack(m, t) { m.phase = 'back'; m.arrive = t; m.returnAt = t + m.travel; }
function resolveSettle(m, t) {
  const err = canFound(m.tx, m.ty);
  const from = cityById(m.fromCity) || capital();
  if (err) {
    marchBack(m, t);
    addReport('info', 'Settlers could not found a city', `Your settlers reached (${m.tx}|${m.ty}) but could not settle: <b>${esc(err)}</b>. They are returning to ${esc(from.name)}.`, t);
    toast('🏕️ Settlers could not found a city', 'bad');
    return;
  }
  const c = makeCity(m.tx, m.ty, nextCityName(), false);
  c.shieldG = gameHours() + CITY_SHIELD_H;
  S.cities.push(c);
  from.expansions = (from.expansions || 0) + 1;
  S.marches = S.marches.filter(x => x.id !== m.id);
  if (m.heroId) { const h = heroById(m.heroId); if (h) h.cityId = c.id; }
  addReport('win', `🏘️ New city founded: ${c.name}`, `Your settlers from ${esc(from.name)} founded <b>${esc(c.name)}</b> at (${c.x}|${c.y}) in ${esc(regionAt(c.x, c.y).name)}.${c.bonus ? `<br>Terrain bonus: <b>+15% ${RES_NAME[c.bonus]}</b>.` : ''}<br>Switch cities from the header to build it up. 🛡️ It is safe from raids for 3 game days.`, t);
  toast(`🏘️ ${c.name} founded!`, 'good');

}
function resolveReinforce(m, t) {
  const dest = cityById(m.toCity);
  if (!dest) { marchBack(m, t); return; }
  for (const k in m.units) dest.troops[k] = (dest.troops[k] || 0) + m.units[k];
  let txt = Object.keys(m.units).map(k => `${U(k).icon} ${m.units[k]} ${esc(U(k).name)}`).join('<br>');
  if (m.heroId) { const h = heroById(m.heroId); if (h) { h.cityId = dest.id; txt += `<br>${h.icon} ${esc(h.name)} now guards ${esc(dest.name)}`; } }
  S.marches = S.marches.filter(x => x.id !== m.id);
  addReport('info', `Reinforcements reached ${dest.name}`, txt || 'They arrived safely.', t);
  toast(`🛡️ Reinforcements reached ${dest.name}`, 'good');

function resolveAttack(m, t) {
  const c = S.setts.find(x => x.id === m.settId);
  const h = m.heroId ? heroById(m.heroId) : null;
  if (!c || c.dead) {
    marchBack(m, t);
    addReport('info', `Only ruins at ${m.tName}`, 'The target had already been razed or abandoned. Your warhost is marching home.', t);
    return;
  }
  const lvl = settLvl(c), wall = settWall(c);
  const atk = Object.keys(m.units).filter(k => m.units[k] > 0).map(k => { const u = U(k); return { key: k, n: m.units[k], att: uAtt(u), cls: u.cls, siege: u.role === 'Siege' }; });
  if (h) atk.push({ key: 'hero', n: 1, att: heroAtt(h), cls: 'inf' });
  const siege = atk.filter(a => a.siege).reduce((s, a) => s + a.n, 0);
  const wallDrop = siege > 0 ? Math.min(wall, Math.floor(Math.sqrt(siege * 2.5))) : 0;
  const effWall = wall - wallDrop;
  const def = Object.keys(c.army).filter(k => c.army[k] >= 0.5).map(k => ({ key: k, n: c.army[k], di: FOES[k].di, dc: FOES[k].dc }));
  const attMult = (1 + (h ? heroOffBonus(h) : 0)) * (waaaghActive() ? 1.25 : 1);
  const r = battle(atk, def, { mode: m.mode, wallMult: Math.pow(1.03, effWall), baseDef: 10 * lvl, luck: rand(0.9, 1.1), attMult, wall: effWall });

  const atkRows = [], surv = {};
  let survN = 0, killed = 0, xp = 0;
  atk.forEach(a => {
    if (a.key === 'hero') return;
    const lost = Math.min(a.n, Math.round(a.n * r.attLoss));
    killed += lost;
    const s = a.n - lost;
    if (s > 0) { surv[a.key] = s; survN += s; }
    const u = U(a.key);
    atkRows.push({ icon: u.icon, name: u.name, n: a.n, lost });
  });
  if (h) atkRows.unshift({ icon: h.icon, name: h.name + ' (Lv ' + h.level + ')', n: 1, lost: 0 });
  const defRows = [];
  def.forEach(d => {
    const before = Math.round(d.n);
    const after = d.n * (1 - r.defLoss);
    c.army[d.key] = after < 0.5 ? 0 : after;
    const lost = Math.max(0, before - Math.round(c.army[d.key]));
    killed += lost;
    xp += lost * FOES[d.key].att / 40;
    defRows.push({ icon: FOES[d.key].icon, name: FOES[d.key].name, n: before, lost });
  });
  let extra = '';
  if (h) {
    extra += heroHurt(h, r.attLoss >= 1 ? 2 : r.attLoss);
    h.streak = r.attWin ? (h.streak || 0) + 1 : 0;
    const lv = gainXP(h, xp + (r.attWin ? 25 : 5));
    extra += `<div class="muted small" style="margin-top:6px">${h.icon} ${esc(h.name)}: +${Math.round(xp + (r.attWin ? 25 : 5))} XP${lv} · ${Math.round(h.hp)}% health${h.streak > 1 ? ' · ' + h.streak + ' victories in a row' : ''}</div>`;
    if (h.wounded) m.heroId = null;
  }
  let loot = null;
  if (survN > 0) {
    let cap = 0;
    Object.keys(surv).forEach(k => { cap += surv[k] * U(k).carry; });
    cap *= plunderMult() * (1 + (h && !h.wounded ? 0.05 * h.skills.logistics : 0));
    const prot = settCranny(c);
    const avail = {};
    RES.forEach(k => { avail[k] = Math.max(0, c.res[k] - prot); });
    loot = distributeLoot(avail, cap);
    RES.forEach(k => { c.res[k] -= loot[k]; });
  }
  m.units = surv;
  if (survN > 0 || m.heroId) { m.loot = loot; marchBack(m, t); }
  else S.marches = S.marches.filter(x => x.id !== m.id);
  const raised = raiseDead(c, killed);
  if (raised) extra += `<div class="note" style="margin-top:8px">🧟 The Vampire Counts raised ${raised} of the fallen as Zombies.</div>`;
  if (wallDrop > 0) extra += `<div class="note" style="margin-top:8px">💥 Your siege engines battered the defenses: wall Lv ${wall} → ${effWall} during the assault.</div>`;
  if (!FACS[c.fac].locked) {
    let drop = m.mode === 'attack' ? 45 : 25;
    if (c.fac === 'dwarfs') { drop *= 2; S.grudges = (S.grudges || 0) + 1; extra += `<div class="note bad" style="margin-top:8px">📕 The Dwarfs have written your name in the Book of Grudges (${S.grudges}).</div>`; }
    changeRel(c.fac, -drop);
  }
  let title;
  const fname = c.name;
  if (r.attWin) { S.stats.wins = (S.stats.wins || 0) + 1; addFight(15); }
  c.hitG = gameHours();
  if (r.attWin) c.stunG = Math.max(c.stunG || 0, gameHours() + 24);
  if (r.attWin && m.mode === 'attack') {
    if (m.claim && h && !h.wounded && m.heroId && claimable(c) && S.renown >= nextCityReq() && S.cities.length < MAX_CITIES) {
      const nc = claimSettlement(c, h);
      m.heroId = null;
      title = `🏰 ${fname} claimed!`;
      extra += `<div class="note good" style="margin-top:8px">${h.icon} ${esc(h.name)} raised your banner over ${esc(fname)}. It is now your city <b>${esc(nc.name)}</b>, and ${esc(h.name)} stays to guard it. The surviving troops march home with the plunder.</div>`;
    } else {
      if (m.claim && claimable(c)) extra += `<div class="note" style="margin-top:8px">Could not claim: ${!h || h.wounded ? 'your Lord fell' : S.renown < nextCityReq() ? 'not enough Renown (' + fmt(S.renown) + '/' + fmt(nextCityReq()) + ')' : 'city limit reached'}. The settlement was razed instead.</div>`;
      const res = defeatSettlement(c);
      if (res === 'razed' && c.fac === 'beastmen') S.stats.razedBeast = (S.stats.razedBeast || 0) + 1;

function setSpeed(n) {
  const now = Date.now();
  simulate(now);
  const k = S.speed / n;
  const fut = t => (t == null ? t : (t > now ? now + (t - now) * k : t));
  const past = t => (t == null ? t : (t < now ? now - (now - t) * k : t));
  S.cities.forEach(c => {
    c.queues.forEach(q => { q.end = fut(q.end); q.start = past(q.start); });
    TRAIN_BLD.forEach(([b]) => (c.trainQ[b] || []).forEach(q => { q.each *= k; if (q.next != null) q.next = fut(q.next); }));
    if (c.smithQ) { c.smithQ.end = fut(c.smithQ.end); c.smithQ.start = past(c.smithQ.start); }
    if (c.feast) { c.feast.end = fut(c.feast.end); c.feast.start = past(c.feast.start); }
  });
  S.marches.forEach(m => {
    m.travel *= k;
    if (m.phase === 'out') { m.depart = past(m.depart); m.arrive = fut(m.arrive); }
    else { m.arrive = past(m.arrive); m.returnAt = fut(m.returnAt); }
  });
  S.incoming.forEach(r => { r.launched = past(r.launched); r.arrive = fut(r.arrive); });
  S.heroes.forEach(h => { if (h.reviveAt) h.reviveAt = fut(h.reviveAt); });
  (S.agents || []).forEach(a => { if (a.mission) { a.mission.start = past(a.mission.start); a.mission.hitAt = a.mission.hit ? past(a.mission.hitAt) : fut(a.mission.hitAt); a.mission.end = fut(a.mission.end); } });
  S.trades.forEach(tr => {
    tr.travel *= k;
    if (tr.phase === 'out') { tr.depart = past(tr.depart); tr.arrive = fut(tr.arrive); }
    else { tr.arrive = past(tr.arrive); tr.returnAt = fut(tr.returnAt); }
  });
  if (S.techQ) { S.techQ.end = fut(S.techQ.end); S.techQ.start = past(S.techQ.start); }
  S.nextRaid = fut(S.nextRaid);
  S.speed = n;
  save();
  toast(`⚡ Game speed set to ${n}×`);
  refreshModal(true);
  rerender();
}

function migrate() {
  let fresh = false;
  if (!S.seed) {
    S.seed = Math.floor(Math.random() * 1e9);
    S.home = { ...HOME_POS[S.faction] };
    (S.marches || []).forEach(m => {
      for (const k in m.units) S.troops[k] = (S.troops[k] || 0) + m.units[k];
      if (m.loot) RES.forEach(r => { S.res[r] += m.loot[r] || 0; });
    });
    S.marches = []; S.incoming = [];
    delete S.camps;
    S.setts = [];
    S.grudges = 0;
    fresh = true;
  }
  if (!S.cities) {
    WORLD = genWorld(S.seed, S.home);
    S.cities = []; S.heroes = [];
    const c = makeCity(S.home.x, S.home.y, S.vname || FACTIONS[S.faction].village, true);
    if (S.res) c.res = S.res;
    if (S.fields) c.fields = S.fields;
    if (S.bld) Object.assign(c.bld, S.bld);
    c.bld.stables = c.bld.barracks >= 3 ? Math.max(c.bld.stables || 0, 1) : 0;
    c.bld.workshop = c.bld.barracks >= 5 ? Math.max(c.bld.workshop || 0, 1) : 0;
    c.bld.residence = c.bld.residence || 0;
    c.bld.temple = c.bld.temple || 0;
    c.queues = S.queues || (S.queue ? [Object.assign(S.queue, { qid: S.nextId++ })] : []);
    Object.keys(S.troops || {}).forEach(k => { if (U(k)) c.troops[k] = (c.troops[k] || 0) + S.troops[k]; });
    (S.trainQ || []).forEach(q => { const u = U(q.unit); if (u) c.trainQ[u.b].push(q); });
    TRAIN_BLD.forEach(([b]) => {
      const arr = c.trainQ[b];
      arr.forEach((q, i) => { if (i > 0) q.next = null; });
      if (arr.length && arr[0].next == null) arr[0].next = Date.now() + arr[0].each;
    });
    c.starve = S.starve || 0; c.starved = S.starved || {};
    S.cities.push(c);
    S.curCity = c.id;
    S.heroes.push(newHero(true, c.id));
    S.marches = (S.marches || []).filter(m => {
      if (m.mode === 'scout') { for (const k in m.units) c.troops[k] = (c.troops[k] || 0) + m.units[k]; return false; }
      m.fromCity = c.id; m.heroId = null; return true;

  initWorld(fresh);

      ${st === 'wounded' && !x.reviveAt ? `<div class="muted small" style="margin-top:8px">Recovers on their own in ${fmtDur(g2r((36 - (x.woundG || 0)) * 3600))}, or pay to tend them faster:</div><h4>Revive</h4>${costChips(rc)}<div class="meta">⏳ ${fmtDur(g2r(reviveTime(x)))} · paid from ${esc(c ? c.name : 'capital')}</div><button class="btn full" onclick="startRevive(${x.id})">🩹 Tend to ${esc(x.name)}</button>` : ''}

/* =========================================================
   WORLD MAP (canvas)
   ========================================================= */
function settAt(x, y) { return S.setts.find(s => s.x === x && s.y === y); }
function cityAt(x, y) { return S.cities.find(c => c.x === x && c.y === y); }
function computeTerritory() {
  const NN = MAP_N * MAP_N;
  const own = new Uint8Array(NN), bestD = new Float32Array(NN).fill(1e9), corr = new Float32Array(NN);
  const claim = (sx, sy, r, o) => {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const x = sx + dx, y = sy + dy;
      if (!inMap(x, y)) continue;
      const d = Math.hypot(dx, dy);
      if (d > r + 0.2) continue;
      const i = idx(x, y);
      if (TK[WORLD.terr[i]] === 'sea') continue;
      if (d < bestD[i]) { bestD[i] = d; own[i] = o; }
    }
  };
  S.setts.forEach(s => { if (!s.dead) claim(s.x, s.y, s.kind === 'capital' || s.kind === 'citadel' ? 5 : 3, FAC_ORDER.indexOf(s.fac) + 2); });
  S.cities.forEach(c => claim(c.x, c.y, c.capital ? 4 : 3, 1));
  (S.sites || []).forEach(st => { if (st.owner) claim(st.x, st.y, 1, 1); });
  if (UI.overlay === 'corruption') for (let y = -MAP_R; y <= MAP_R; y++) for (let x = -MAP_R; x <= MAP_R; x++) corr[idx(x, y)] = corruptionAt(x, y);
  MAPV.own = own; MAPV.corr = corr;
}
function ownColor(o) { return o === 1 ? '#f2d27e' : FACS[FAC_ORDER[o - 2]].color; }
function buildMini() {
  const cv = document.createElement('canvas');
  cv.width = MAP_N * 2; cv.height = MAP_N * 2;
  const ctx = cv.getContext('2d');
  for (let y = -MAP_R; y <= MAP_R; y++) for (let x = -MAP_R; x <= MAP_R; x++) {
    ctx.fillStyle = WORLD.col[idx(x, y)];
    ctx.fillRect((x + MAP_R) * 2, (MAP_R - y) * 2, 2, 2);
  }
  S.setts.forEach(s => {
    if (s.dead) return;
    ctx.fillStyle = FACS[s.fac].color;
    ctx.fillRect((s.x + MAP_R) * 2 - 1, (MAP_R - s.y) * 2 - 1, 4, 4);
  });
  ctx.fillStyle = '#f2d27e';
  S.cities.forEach(c => ctx.fillRect((c.x + MAP_R) * 2 - 2, (MAP_R - c.y) * 2 - 2, 6, 6));
  MAPV.mini = cv;
}
function requestDraw() {
  if (MAPV.raf) return;
  MAPV.raf = requestAnimationFrame(() => { MAPV.raf = 0; drawMap(); });
}
function pathPos(path, frac) {
  if (!path || !path.length) return null;
  const f = clamp(frac, 0, 1) * (path.length - 1);
  const i = Math.floor(f), t = f - i;
  const a = path[i], b = path[Math.min(path.length - 1, i + 1)];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
function drawMap() {
  const cv = $('mapCv');
  if (!cv || !S || !WORLD) return;
  const box = cv.parentElement;
  const W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#050403';
  ctx.fillRect(0, 0, W, H);
  const z = UI.cam.z, cx = UI.cam.x, cy = UI.cam.y;
  const sxOf = x => W / 2 + (x - cx) * z, syOf = y => H / 2 - (y - cy) * z;
  const x0 = Math.max(-MAP_R, Math.floor(cx - W / 2 / z) - 1), x1 = Math.min(MAP_R, Math.ceil(cx + W / 2 / z) + 1);
  const y0 = Math.max(-MAP_R, Math.floor(cy - H / 2 / z) - 1), y1 = Math.min(MAP_R, Math.ceil(cy + H / 2 / z) + 1);
  const ov = UI.overlay, own = MAPV.own, corr = MAPV.corr;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = idx(x, y);
      const px = sxOf(x) - z / 2, py = syOf(y) - z / 2;
      ctx.fillStyle = WORLD.col[i];
      ctx.fillRect(px, py, z + 0.6, z + 0.6);
      if (ov === 'territory' && own && own[i]) { ctx.fillStyle = ownColor(own[i]) + '30'; ctx.fillRect(px, py, z + 0.6, z + 0.6); }
      else if (ov === 'corruption' && corr && corr[i] > 1) { ctx.fillStyle = `rgba(150,40,200,${Math.min(0.75, corr[i] / 80)})`; ctx.fillRect(px, py, z + 0.6, z + 0.6); }
      if (z >= 18) {
        const dec = TERRAIN[TK[WORLD.terr[i]]].dec;
        if (dec && hash2(x, y, S.seed + 5) < 0.55 && !settAt(x, y) && !cityAt(x, y)) {
          ctx.globalAlpha = 0.38; ctx.font = `${Math.round(z * 0.55)}px serif`;
          ctx.fillText(dec, px + z / 2, py + z / 2 + 1); ctx.globalAlpha = 1;
        }
      }
    }
  }
  if (ov === 'territory' && own) {
    ctx.lineWidth = Math.max(1, z / 12);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = idx(x, y), o = own[i];
      if (!o) continue;
      const px = sxOf(x) - z / 2, py = syOf(y) - z / 2;
      ctx.strokeStyle = ownColor(o) + 'cc';
      const edge = (nx, ny) => !inMap(nx, ny) || own[idx(nx, ny)] !== o;
      ctx.beginPath();
      if (edge(x + 1, y)) { ctx.moveTo(px + z, py); ctx.lineTo(px + z, py + z); }
      if (edge(x - 1, y)) { ctx.moveTo(px, py); ctx.lineTo(px, py + z); }
      if (edge(x, y + 1)) { ctx.moveTo(px, py); ctx.lineTo(px + z, py); }
      if (edge(x, y - 1)) { ctx.moveTo(px, py + z); ctx.lineTo(px + z, py + z); }
      ctx.stroke();
    }
  }
  if (z >= 30) {
    ctx.strokeStyle = '#ffffff0a'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = x0; x <= x1 + 1; x++) { const px = sxOf(x) - z / 2; ctx.moveTo(px, 0); ctx.lineTo(px, H); }
    for (let y = y0 - 1; y <= y1; y++) { const py = syOf(y) - z / 2; ctx.moveTo(0, py); ctx.lineTo(W, py); }
    ctx.stroke();
  }
  if (z <= 24) {
    ctx.font = `600 ${Math.round(clamp(z * 0.85, 11, 17))}px Palatino, Georgia, serif`;
    REGIONS.forEach(r => {
      if (r.sea) return;
      const px = sxOf(r.x), py = syOf(r.y) - z * 1.2;
      ctx.lineWidth = 3; ctx.strokeStyle = '#000000b0'; ctx.strokeText(r.name.toUpperCase(), px, py);
      ctx.fillStyle = '#f2d27ecc'; ctx.fillText(r.name.toUpperCase(), px, py);
    });
  }
  const now = Date.now();
  const drawRoute = (path, frac, color, icon) => {
    if (!path || path.length < 2) return;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, z / 10); ctx.setLineDash([z / 3, z / 4]);
    ctx.beginPath();
    path.forEach(([x, y], i) => { const px = sxOf(x), py = syOf(y); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
    ctx.stroke(); ctx.restore();
    const p = pathPos(path, frac);
    if (p) {
      const px = sxOf(p[0]), py = syOf(p[1]);
      ctx.fillStyle = '#000000aa'; ctx.beginPath(); ctx.arc(px, py, Math.max(7, z * 0.38), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = `${Math.round(Math.max(10, z * 0.42))}px serif`; ctx.fillStyle = '#fff'; ctx.fillText(icon, px, py + 1);
    }
  };
  S.marches.forEach(m => {
    const out = m.phase === 'out';
    const frac = out ? (now - m.depart) / Math.max(1, m.arrive - m.depart) : 1 - (now - m.arrive) / Math.max(1, m.returnAt - m.arrive);
    const h = m.heroId ? heroById(m.heroId) : null;
    const icon = m.mode === 'settle' ? '🏕️' : h ? h.icon : m.mode === 'reinforce' ? '🛡️' : out ? '⚔️' : '💰';
    drawRoute(m.path, frac, m.mode === 'settle' || m.mode === 'reinforce' ? '#86b84f' : '#f2d27e', icon);
  });
  S.incoming.forEach(r => { if (r.spotted) drawRoute(r.path, (now - r.launched) / Math.max(1, r.arrive - r.launched), '#ff5a45', FACS[r.fac].icon); });
  S.trades.forEach(tr => { const out = tr.phase === 'out'; const frac = out ? (now - tr.depart) / Math.max(1, tr.arrive - tr.depart) : 1 - (now - tr.arrive) / Math.max(1, tr.returnAt - tr.arrive); drawRoute(tr.path, frac, '#7fb6d6', '🛒'); });
  S.setts.forEach(s => {
    if (s.x < x0 || s.x > x1 || s.y < y0 || s.y > y1) return;
    const px = sxOf(s.x), py = syOf(s.y);
    const rad = Math.max(6, z * (s.kind === 'capital' || s.kind === 'citadel' || s.kind === 'champion' ? 0.5 : 0.42));
    if (s.dead) { ctx.globalAlpha = 0.7; ctx.font = `${Math.round(rad * 1.3)}px serif`; ctx.fillText('🏚️', px, py); ctx.globalAlpha = 1; return; }
    ctx.fillStyle = '#0b0806e0'; ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = FACS[s.fac].color; ctx.lineWidth = s.kind === 'capital' || s.kind === 'citadel' ? 3 : s.kind === 'champion' ? 4 : 2; ctx.stroke();
    if (z >= 12) { ctx.font = `${Math.round(rad * 1.15)}px serif`; ctx.fillStyle = '#fff'; ctx.fillText(settIcon(s), px, py + 1); }
    if (z >= 18) {
      ctx.font = `800 ${Math.round(clamp(z * 0.32, 9, 13))}px sans-serif`;
      const bx = px + rad * 0.8, by = py + rad * 0.75;
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(bx, by, Math.max(6, z * 0.2), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = FACS[s.fac].color; ctx.fillText(String(settLvl(s)), bx, by + 0.5);
    }
  });
  (S.sites || []).forEach(st => {
    if (st.x < x0 || st.x > x1 || st.y < y0 || st.y > y1) return;
    const px = sxOf(st.x), py = syOf(st.y), rad = Math.max(6, z * 0.42);
    ctx.fillStyle = '#10180ce6'; ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = st.owner ? '#f2d27e' : '#86b84f'; ctx.lineWidth = st.owner ? 3 : 1.5; ctx.stroke();
    if (z >= 10) { ctx.font = `${Math.round(rad * 1.05)}px serif`; ctx.fillStyle = '#fff'; ctx.fillText(SITE_KINDS[st.kind].icon, px, py + 1); }
    if (z >= 18 && !st.owner) { ctx.font = `800 ${Math.round(clamp(z * 0.3, 8, 12))}px sans-serif`; ctx.fillStyle = '#86b84f'; ctx.fillText(String(st.lvl), px + rad * 0.85, py + rad * 0.8); }
    if (st.owner) { const oc = cityById(st.owner); if (oc) { ctx.save(); ctx.strokeStyle = '#f2d27e88'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sxOf(oc.x), syOf(oc.y)); ctx.stroke(); ctx.restore(); } }
  });
  S.adventures.forEach(a => {
    if (a.x < x0 || a.x > x1 || a.y < y0 || a.y > y1) return;

function startGesture() {

  if (p.length === 1) MAPV.g = { type: 'pan', sx: p[0].x, sy: p[0].y, cx: UI.cam.x, cy: UI.cam.y, moved: wasPinch, t: Date.now() };
  else if (p.length >= 2) MAPV.g = { type: 'pinch', d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, z0: UI.cam.z };

function moveGesture() {

    const dx = p[0].x - g.sx, dy = p[0].y - g.sy;
    if (Math.abs(dx) + Math.abs(dy) > 8) g.moved = true;
    if (g.moved) {

      UI.cam.y = clamp(g.cy + dy / UI.cam.z, -MAP_R, MAP_R);

function smithLv(id) { return (S.smith && S.smith[id]) || 0; }

function smithCost(u, to) { const f = 3 * Math.pow(1.18, to - 1); return u.cost.map(x => Math.round(x * f / 5) * 5); }
function smithTimeSec(c, u, to) { return u.time * 6 * Math.pow(1.12, to - 1) * Math.pow(0.96, Math.max(0, c.bld.smithy - 1)) * (S.faction === 'empire' ? 0.9 : 1); }

}
function smithCancel() {

const FEASTS = {

  great: { name: 'Great Festival', icon: '🎆', req: 10, hours: 60, cost: [7000, 7500, 7000, 4000], base: 1.0 }
};
const FEAST_NAMES = { empire: { small: 'Feast of Sigmar', great: 'Grand Carnival of the Reik' }, elves: { small: 'Feast of Asuryan', great: 'Festival of the Phoenix King' }, greenskins: { small: 'Big Grub-Up', great: 'Da Biggest Feast Eva' } };
function feastName(k) { return (FEAST_NAMES[S.faction] || {})[k] || FEASTS[k].name; }
function feastHours(c, k) { return FEASTS[k].hours * Math.pow(0.97, Math.max(0, c.bld.townhall - 1)); }
function feastReward(c, k) { return Math.round(renownRate() * FEASTS[k].hours * (FEASTS[k].base + 0.03 * c.bld.townhall) * (k === 'great' ? 1.5 : 1) * (1 + TB('feast'))); }
function feastStart(k) {
  simulate(Date.now());
  const c = CUR(), F = FEASTS[k];
  if (c.bld.townhall < F.req) return toast(`Requires Town Hall Lv ${F.req}`, 'bad');
  if (c.feast) return toast('A feast is already under way here', 'bad');
  if (!afford(c, F.cost)) return toast('Not enough resources', 'bad');
  pay(c, F.cost);
  const now = Date.now();
  c.feast = { kind: k, start: now, end: now + g2r(feastHours(c, k) * 3600), reward: feastReward(c, k) };
  save(); refreshModal(true); rerender();
  toast(`${F.icon} ${feastName(k)} begins in ${c.name}!`, 'good');
}
function feastDone(cid, t) {
  const c = cityById(cid);
  if (!c || !c.feast) return;
  const f = c.feast;
  S.renown += f.reward;
  S.stats.feasts = (S.stats.feasts || 0) + 1;
  c.feast = null;
  if (S.faction === 'greenskins' && typeof addFight === 'function') addFight(f.kind === 'great' ? 30 : 10);
  addReport('info', `${cityTag(c)}${feastName(f.kind)} ends`, `${FEASTS[f.kind].icon} The people of ${esc(c.name)} will speak of it for years. <b>+${fmt(f.reward)} Renown</b>.`, t);
  toast(`${FEASTS[f.kind].icon} +${fmt(f.reward)} Renown from the ${feastName(f.kind)}`, 'good');
}
function townhallHTML(c) {
  if (c.bld.townhall < 1) return '';
  let h = `<h4>🎪 Celebrations</h4>`;
  if (c.feast) {
    const F = FEASTS[c.feast.kind];
    h += `<div class="qitem" style="margin-bottom:8px"><div class="qicon">${F.icon}</div><div style="flex:1;min-width:0"><b>${feastName(c.feast.kind)}</b>
      <div class="meta">Ends in <span class="cd" data-cd="${c.feast.end}"></span> · +${fmt(c.feast.reward)} Renown${c.feast.kind === 'great' ? ' · +10% production now' : ''}</div><div class="prog"><i data-ps="${c.feast.start}" data-pe="${c.feast.end}"></i></div></div></div>`;
  }
  h += Object.keys(FEASTS).map(k => {
    const F = FEASTS[k], locked = c.bld.townhall < F.req;
    const cp = caps(c), tooBig = Math.max(F.cost[0], F.cost[1], F.cost[2]) > cp.wh || F.cost[3] > cp.gr;
    const block = locked ? `Needs Town Hall Lv ${F.req}` : c.feast ? 'Feast under way' : tooBig ? 'Storage too small' : '';
    return `<div class="${locked ? 'locked' : ''}" style="border-top:1px solid #ffffff0d;padding-top:10px;margin-top:10px"><div class="row"><div class="qicon">${F.icon}</div><div style="flex:1;min-width:0"><b>${feastName(k)}</b>
      <div class="meta">Lasts ${fmtDur(g2r(feastHours(c, k) * 3600))} · reward <b class="pos">+${fmt(feastReward(c, k))} Renown</b>${k === 'great' ? ' · +10% production while it lasts' : ''}</div></div></div>
      ${costChips(F.cost)}<button class="btn full" ${block ? 'disabled' : ''} data-cost="${F.cost.join(',')}" data-block="${block ? 1 : 0}" onclick="feastStart('${k}')">${block || 'Hold the ' + feastName(k)}</button></div>`;
  }).join('');
  return h + `<div class="muted small" style="margin-top:6px">Renown reward scales with your realm's current Renown rate and the Town Hall level.</div>`;
}

/* ----- Trapper ----- */
function trapCapL(l) { return Math.round((6 * l + 0.6 * l * l) * (S.faction === 'greenskins' ? 1.5 : 1) * (1 + TB('traps'))); }
function prisonerCount(c) { return (c.prisoners || []).reduce((a, p) => a + sumObj(p.units), 0); }
function trapsArmed(c) { return Math.max(0, trapCapL(c.bld.trapper || 0) - prisonerCount(c)); }
function springTraps(c, r) {
  const armed = trapsArmed(c);
  if (armed <= 0) return '';
  const keys = Object.keys(r.army).filter(k => r.army[k] >= 1 && k !== 'archaon');
  const total = keys.reduce((a, k) => a + Math.floor(r.army[k]), 0);
  let n = Math.min(armed, Math.floor(total * 0.35));
  if (n <= 0) return '';
  const caught = {};
  let left = n;
  keys.forEach(k => { const x = Math.min(Math.floor(r.army[k]), Math.floor(n * Math.floor(r.army[k]) / total)); if (x > 0) { caught[k] = x; left -= x; } });
  keys.slice().sort((a, b) => r.army[b] - r.army[a]).forEach(k => { if (left > 0) { const room = Math.floor(r.army[k]) - (caught[k] || 0); const x = Math.min(room, left); if (x > 0) { caught[k] = (caught[k] || 0) + x; left -= x; } } });
  for (const k in caught) r.army[k] -= caught[k];
  c.prisoners.push({ id: S.nextId++, fac: r.fac, from: r.fromName, settId: r.settId, units: caught, g: gameHours() });
  S.stats.captured = (S.stats.captured || 0) + n;
  return `<div class="note good" style="margin-top:8px">🪤 Your traps caught <b>${n}</b> raiders before the battle: ${Object.keys(caught).map(k => caught[k] + ' ' + FOES[k].icon).join(' ')}</div>`;
}
function freePrisoners(c, fac) {
  const n = (c.prisoners || []).filter(p => p.fac === fac).reduce((a, p) => a + sumObj(p.units), 0);
  if (n) c.prisoners = c.prisoners.filter(p => p.fac !== fac);
  return n;
}
function prisonerValue(p) { return Object.keys(p.units).reduce((a, k) => a + p.units[k] * (FOES[k].att + FOES[k].di + FOES[k].dc), 0); }
function prisonerAct(pid, act) {
  simulate(Date.now());
  const c = CUR();
  const p = (c.prisoners || []).find(x => x.id === pid);
  if (!p) return;
  const n = sumObj(p.units), F = FACS[p.fac];
  c.prisoners = c.prisoners.filter(x => x.id !== pid);
  if (act === 'ransom') {
    const v = Math.round(prisonerValue(p) * 0.15), cp = caps(c);
    RES.forEach(k => { c.res[k] = Math.min(k === 'crop' ? cp.gr : cp.wh, c.res[k] + v); });
    changeRel(p.fac, 3);
    toast(`💰 The ${F.name} paid ${fmt(v)} of each resource`, 'good');
  } else if (act === 'release') {
    const d = Math.min(20, Math.max(4, Math.round(n * 0.3)));
    changeRel(p.fac, d);
    const src = S.setts.find(x => x.id === p.settId && !x.dead);
    if (src) for (const k in p.units) src.army[k] = (src.army[k] || 0) + p.units[k];
    toast(`🕊️ Released ${n} ${F.name} captives (+${d} relations)`, 'good');
  } else {
    const r = Math.round(prisonerValue(p) * 0.2);
    S.renown += r;
    if (S.faction === 'greenskins') addFight(Math.min(20, n / 5));
    toast(`⚔️ ${n} captives executed · +${fmt(r)} Renown`, 'good');
  }
  save(); refreshModal(true); rerender();
}
function trapperHTML(c) {
  if (c.bld.trapper < 1) return '';
  const cap = trapCapL(c.bld.trapper), pc = prisonerCount(c);
  let h = `<h4>🪤 Traps</h4><div class="stats s3"><div class="stat"><b>${fmt(cap)}</b><span>Traps</span></div><div class="stat"><b>${fmt(cap - pc)}</b><span>Armed</span></div><div class="stat"><b>${fmt(pc)}</b><span>Captives</span></div></div>
    <div class="muted small" style="margin:6px 0">Traps catch up to 35% of a raiding army before battle. Each captive fills a trap. If raiders of the same faction win a battle here, they free their kin.${S.faction === 'greenskins' ? ' Squig pits: +50% traps.' : ''}</div>`;
  if (!c.prisoners.length) return h + '<div class="note">No captives yet.</div>';
  h += c.prisoners.map(p => {
    const F = FACS[p.fac], n = sumObj(p.units), dip = !F.locked;
    return `<div class="facrow"><div class="row"><span style="font-size:20px">${F.icon}</span><div style="flex:1;min-width:0"><b>${n} ${F.name}</b> <span class="muted small">from ${esc(p.from)}</span>
      <div class="meta">${Object.keys(p.units).map(k => p.units[k] + ' ' + FOES[k].icon + ' ' + FOES[k].name).join(' · ')}</div></div></div>
      <div class="row" style="margin-top:6px;gap:6px">${dip ? `<button class="btn ghost sm" style="flex:1" onclick="prisonerAct(${p.id},'ransom')">💰 Ransom ${fmt(Math.round(prisonerValue(p) * 0.15))} each</button>
      <button class="btn ghost sm" style="flex:1" onclick="prisonerAct(${p.id},'release')">🕊️ Release (+${Math.min(20, Math.max(4, Math.round(n * 0.3)))})</button>` : ''}
      <button class="btn ghost sm" style="flex:1" onclick="prisonerAct(${p.id},'execute')">⚔️ Execute (+${fmt(Math.round(prisonerValue(p) * 0.2))} Renown)</button></div></div>`;
  }).join('');
  return h;
}

/* ----- Veterancy ----- */
const VET_RANKS = [[0, 'Recruit'], [1, 'Blooded'], [3, 'Seasoned'], [6, 'Veteran'], [10, 'Elite'], [15, 'Legendary']];
function unitTotal(id) {
  let n = 0;
  S.cities.forEach(c => { n += c.troops[id] || 0; });
  S.marches.forEach(m => { n += (m.units && m.units[id]) || 0; });
  return n;
}
function vetAvg(id) {
  const n = unitTotal(id);
  if (n <= 0) { if (S.vxp && S.vxp[id]) S.vxp[id] = 0; return 0; }
  return ((S.vxp && S.vxp[id]) || 0) / n;
}
function vetRank(id) {
  const u = U(id);
  if (!u || u.role === 'Settler') return 0;
  const a = vetAvg(id);
  let r = 0;
  VET_RANKS.forEach((x, i) => { if (a >= x[0]) r = i; });
  return u.ror ? Math.max(3, r) : r;
}
function vetMult(id) { return 1 + 0.03 * vetRank(id); }
function vetStars(id) { const r = vetRank(id); return r ? `<span style="color:var(--gold)" title="${VET_RANKS[r][1]}">${'★'.repeat(r)}</span>` : ''; }
function vetBadge(id) {
  const r = vetRank(id), u = U(id);
  if (!u || u.role === 'Settler' || !unitTotal(id) && !u.ror) return '';
  const nx = VET_RANKS[r + 1];
  return `<div class="muted small">${r ? vetStars(id) + ' ' : ''}${VET_RANKS[r][1]} +${3 * r}%${nx && unitTotal(id) ? ` · ${vetAvg(id).toFixed(1)}/${nx[0]} XP each` : ''}</div>`;
}
function vetAfter(list, lossFrac, won, ratio) {
  if (!S.vxp) S.vxp = {};
  const gain = (won ? 1 : 0.5) * clamp(ratio * 1.5, 0.2, 1.5) * (1 + TB('vet'));
  const ups = [];
  list.forEach(a => {
    const u = a.key !== 'hero' ? U(a.key) : null;
    if (!u || u.role === 'Settler') return;
    const before = vetRank(a.key);
    const lost = Math.min(a.n, Math.round(a.n * lossFrac)), surv = a.n - lost;
    const now = unitTotal(a.key), pool = S.vxp[a.key] || 0;
    const avgB = (now + lost) > 0 ? pool / (now + lost) : 0;
    S.vxp[a.key] = Math.max(0, pool - avgB * lost) + surv * gain;
    const after = vetRank(a.key);
    if (after > before) ups.push(`${u.icon} ${u.name} ${'★'.repeat(after)} ${VET_RANKS[after][1]}`);
  });
  return ups.length ? `<div class="note good" style="margin-top:8px">🎖️ Promoted: ${ups.join(' · ')}</div>` : '';
}

/* ----- Regiments of Renown ----- */
function rorProgress(u) { return (S.stats && S.stats[u.cond[0]]) || 0; }
function rorUnlocked(u) { return !!(S.rorU && S.rorU[u.id]) || rorProgress(u) >= u.cond[1]; }
function rorCount(id) {
  let n = unitTotal(id);
  S.cities.forEach(c => TRAIN_BLD.forEach(([b]) => (c.trainQ[b] || []).forEach(q => { if (q.unit === id) n += q.left; })));
  return n;
}
function rorCheck() {
  if (!S.rorU) S.rorU = {};
  UNITS[S.faction].filter(u => u.ror && !S.rorU[u.id] && rorProgress(u) >= u.cond[1]).forEach(u => {
    S.rorU[u.id] = true;
    addReport('info', `🏅 Regiment of Renown: ${u.name}`, `${u.icon} <b>${esc(u.name)}</b> will now answer your call (${esc(u.cond[2])}).<br><i>${esc(u.lore)}</i><br>Recruit them in the ${bldName(u.b)} (Lv ${u.req}). At most ${ROR_CAP} may serve at once.`, S.time);
    toast(`🏅 ${u.name} unlocked!`, 'good');
  });
}

/* ----- Agents ----- */
const AGENT_DEF = {
  empire: { name: 'Witch Hunter', icon: '🕵️', names: ['Mattheus Krieger', 'Ilse Brandt', 'Gottfried Asch', 'Lukas Hexendorf', 'Hilde Marr', 'Konrad Weiss'] },
  elves: { name: 'Loremaster', icon: '🪄', names: ['Aelyth Starsong', 'Ithrandel', 'Saerith Moonveil', 'Caradryel', 'Lianne Dawnspire', 'Elathor'] },
  greenskins: { name: 'Goblin Shaman', icon: '🍄', names: ['Snikrot Mushbrain', 'Grizzik', 'Nagbad da Loopy', 'Skrit Squigeye', 'Ozgob', 'Wurrzag Jr.'] }
};
const MISSIONS = {
  sabotage: { icon: '💥', name: 'Sabotage walls', base: 0.7, desc: 'Cuts the walls by 3–6 levels for 24 game hours. Time your assault!' },
  assassinate: { icon: '🗡️', name: 'Thin the garrison', base: 0.6, desc: 'Slays 10–20% of the defenders.' },
  dissent: { icon: '🌀', name: 'Sow dissent', base: 0.65, desc: 'Halts the settlement’s growth for 48 game hours and sets it back.' }
};
function agentMax() { return Math.min(4, S.cities.length + 1); }
function agentCost() { const k = 1 + 0.6 * S.agents.length; return [600, 600, 600, 400].map(x => Math.round(x * k / 10) * 10); }
function agentLvl(a) { return Math.min(10, 1 + Math.floor((a.xp || 0) / 2)); }
function agentStatus(a) { return a.dead ? 'dead' : a.mission ? 'away' : gameHours() < (a.woundG || 0) ? 'wounded' : 'home'; }
function agentChance(a, s, kind) {
  let ch = MISSIONS[kind].base + 0.04 * (agentLvl(a) - 1) - 0.012 * settLvl(s);
  if (s.kind === 'champion') ch -= 0.15; else if (s.kind === 'citadel') ch -= 0.1; else if (s.kind === 'capital') ch -= 0.05;
  if (S.faction === 'empire' && (s.fac === 'chaos' || s.fac === 'vampires' || s.fac === 'beastmen')) ch += 0.05;
  ch += TB('agent');
  return clamp(ch, 0.1, 0.92);
}
function recruitAgent() {
  simulate(Date.now());
  const c = CUR();
  if (S.agents.filter(a => !a.dead).length >= agentMax()) return toast(`At most ${agentMax()} agents (one more per city)`, 'bad');
  if (c.bld.keep < 5) return toast('Requires Keep Lv 5 in this city', 'bad');
  const cost = agentCost();
  if (!afford(c, cost)) return toast('Not enough resources', 'bad');
  pay(c, cost);
  const D = AGENT_DEF[S.faction];
  const used = new Set(S.agents.map(a => a.name));
  const name = D.names.find(n => !used.has(n)) || pick(D.names) + ' ' + roman(2 + S.agents.length);
  S.agents.push({ id: S.nextId++, name, cityId: c.id, xp: 0, wins: 0, mission: null, woundG: 0, dead: false });
  save(); rerender(); toast(`${D.icon} ${name} joins your service`, 'good');
}
function bestAgent() {
  const idle = S.agents.filter(a => agentStatus(a) === 'home' && cityById(a.cityId));
  return idle.sort((p, q) => agentLvl(q) - agentLvl(p))[0] || null;
}
function sendAgent(sid, kind) {
  simulate(Date.now());
  const s = S.setts.find(x => x.id === sid && !x.dead);
  const a = bestAgent();
  if (!s || !a) return toast('No agent available', 'bad');
  const from = cityById(a.cityId);
  const p = findPath(from.x, from.y, s.x, s.y);
  const tiles = isFinite(p.cost) ? p.cost : Math.hypot(s.x - from.x, s.y - from.y) * 1.5;
  const legH = tiles / 14;
  const now = Date.now();
  a.mission = { kind, sid, tName: s.name, chance: agentChance(a, s, kind), start: now, hitAt: now + g2r((legH + 1) * 3600), end: now + g2r((2 * legH + 2) * 3600), hit: false, ok: null };
  save(); refreshModal(true); rerender();
  toast(`${AGENT_DEF[S.faction].icon} ${a.name} sets out: ${MISSIONS[kind].name}`);
}
function agentEvent(id, t) {
  const a = S.agents.find(x => x.id === id);
  if (!a || !a.mission) return;
  const m = a.mission, D = AGENT_DEF[S.faction], M = MISSIONS[m.kind];
  if (!m.hit) {
    m.hit = true;
    const s = S.setts.find(x => x.id === m.sid && !x.dead);
    if (!s) { m.ok = null; m.note = 'The target was gone when the agent arrived.'; return; }
    const gh = gameHours();
    m.ok = Math.random() < m.chance;
    if (m.ok) {
      if (m.kind === 'sabotage') { s.sabW = 3 + Math.floor(Math.random() * 4); s.sabG = gh + 24; m.note = `The walls of ${esc(s.name)} are weakened by <b>${s.sabW} levels</b> for 24 game hours.`; }
      else if (m.kind === 'assassinate') { const f = rand(0.1, 0.2) + 0.01 * agentLvl(a); let k = 0; for (const u in s.army) { const x = s.army[u] * f; k += x; s.army[u] -= x; } m.note = `About <b>${fmt(k)}</b> defenders of ${esc(s.name)} were slain in the night.`; S.stats.kills = (S.stats.kills || 0) + Math.round(k); }
      else { s.stunG = Math.max(s.stunG || 0, gh + 48); s.gx = (s.gx || 0) - 0.5; m.note = `${esc(s.name)} is torn by strife: no growth for 48 game hours, and it slips back.`; }
      if (!FACS[s.fac].locked) changeRel(s.fac, -8);
    } else {
      const roll = Math.random();
      if (roll < 0.15) { a.dead = true; m.note = `${esc(a.name)} was caught and executed.`; }
      else { a.woundG = gh + ((m.end - m.hitAt) / 3.6e6 * S.speed) + 24; m.note = `${esc(a.name)} was discovered and barely escaped, wounded.`; }
      if (!FACS[s.fac].locked) changeRel(s.fac, -15);
    }
    if (a.dead) { a.mission = null; addReport('loss', `${D.icon} ${a.name} is lost`, `${M.icon} ${M.name} at ${esc(m.tName)} failed. ${m.note}`, t); toast(`☠️ Agent ${a.name} was killed`, 'bad'); }
    return;
  }
  a.mission = null;
  if (m.ok) { a.xp = (a.xp || 0) + 1; a.wins = (a.wins || 0) + 1; S.stats.agentOps = (S.stats.agentOps || 0) + 1; }
  addReport(m.ok ? 'win' : m.ok === false ? 'loss' : 'info', `${D.icon} ${a.name}: ${M.name} ${m.ok ? 'succeeded' : m.ok === false ? 'failed' : 'aborted'}`, `${M.icon} Target: ${esc(m.tName)}.<br>${m.note || ''}${m.ok ? `<br>${esc(a.name)} is now Lv ${agentLvl(a)}.` : ''}`, t);
  toast(`${D.icon} ${a.name}: ${M.name} ${m.ok ? 'succeeded' : 'failed'}`, m.ok ? 'good' : 'bad');
}
function moveAgent(id) {
  const a = S.agents.find(x => x.id === id);
  if (!a || agentStatus(a) !== 'home') return;
  a.cityId = CUR().id;
  save(); rerender(); toast(`${a.name} now operates from ${CUR().name}`);
}
function dismissAgent(id) { S.agents = S.agents.filter(x => x.id !== id); save(); rerender(); }

const ODDS = {

  const base = { mode, wallMult: Math.pow(1.03, effWall), baseDef: (tgt.isSite ? 5 : 10) * tgt.lvl, attMult, wall: effWall };
  const r = battle(atk, def, Object.assign({}, base, { luck: 1 }));

  const hi = battle(atk, def, Object.assign({}, base, { luck: 1.1 }));

}

  const foes = Object.keys(t.army).filter(k => FOES[k] && (t.army[k] >= 0.5 || m.army));

  // army
  h += `<h4>Your army</h4>`;
  if (h0) h += `<label class="check"><input type="checkbox" ${m.hero ? 'checked' : ''} onchange="UI.sim.hero=this.checked;updateSim()"> <span>${h0.icon} Lead with <b>${esc(h0.name)}</b> (Lv ${h0.level}, ⚔️${heroAtt(h0)}, +${Math.round(heroOffBonus(h0) * 100)}% offense)</span></label>`;
  h += UNITS[S.faction].filter(u => u.role !== 'Settler').map(u => `<div class="simrow"><span style="font-size:18px">${u.icon}</span><div class="nm">${u.name} ${tagIcon(u.id)}<div class="muted small">⚔️${u.att} · home ${c.troops[u.id] || 0}</div></div>
    <input type="number" inputmode="numeric" min="0" value="${m.units[u.id] || 0}" oninput="simUnit('${u.id}',this.value)"></div>`).join('');
  h += `<div class="row" style="margin-top:6px"><button class="btn ghost sm" onclick="simFill('home')">🏰 Home troops</button><button class="btn ghost sm" onclick="simFill('clear')">Clear</button></div>`;

  if (m.guide) h += `<div class="note small">${['antilarge', 'ranged', 'cav', 'monster', 'siege', 'inf'].map(k => `${TAG_INFO[k].icon} <b>${TAG_INFO[k].name}</b> — ${TAG_INFO[k].desc}`).join('<br>')}<br><span class="muted">Bonuses scale with how much of the enemy's army (by power) is of the countered type.</span></div>`;

}
function simAdvice(r, t, m) {
  const tips = [];
  const dl = r.dSh.cav + r.dSh.monster, al = r.aSh.cav + r.aSh.monster;
  if (dl > 0.25 && r.aSh.antilarge < 0.15) tips.push(`Their army is ${Math.round(dl * 100)}% cavalry & monsters — 🔱 anti-large units would gain up to +${Math.round(dl * 50)}%.`);
  if (r.dSh.ranged > 0.2 && r.aSh.cav < 0.15) tips.push(`${Math.round(r.dSh.ranged * 100)}% of them are ranged — 🐎 cavalry would gain +${Math.round(r.dSh.ranged * 25)}%.`);
  const foot = r.dSh.inf + r.dSh.ranged + r.dSh.siege;
  if (foot > 0.5 && r.aSh.monster < 0.1 && UNITS[S.faction].some(u => unitTag(u.id) === 'monster')) tips.push(`Mostly infantry — 🦣 monsters would gain +${Math.round(foot * 25)}%.`);
  if (al > 0.4 && r.dSh.antilarge > 0.2) tips.push(`⚠️ Their 🔱 anti-large troops get +${Math.round(al * 50)}% defense against your large units.`);
  if (t.wall > 0 && r.drop === 0 && m.mode === 'attack') tips.push(`Wall Lv ${t.wall} adds +${Math.round((Math.pow(1.03, t.wall) - 1) * 100)}%${r.dSh.ranged > 0 ? ' and their ranged units get +30%' : ''} — siege engines can breach it.`);
  if (!r.attWin && r.A > 0) tips.push(`You need about <b>${(r.D / r.A).toFixed(2)}×</b> your current offense to win.`);
  if (m.mode === 'raid' && r.attWin && t.loot > 0 && r.survCarry < t.loot) tips.push(`Survivors can carry ${fmt(r.survCarry)} of ${fmt(t.loot)} lootable — more carriers would haul more.`);
  return tips;
}
function updateSim() {
  const el = $('simOut');
  if (!el || !UI.sim) return;
  const m = UI.sim, c = CUR();
  const t = simTarget();
  const h0 = m.hero ? homeHero(c) : null;
  const r = forecastBattle(m.units, h0, t, m.mode);
  if (!r.atk.length) { el.innerHTML = 'Add some troops to see the forecast.'; return; }
  const ab = Math.round(r.atkBonus * 100), dbn = Math.round(r.defBonus * 100);
  const lossRow = (icon, name, n, lost) => `<tr><td>${icon} ${esc(name)}</td><td>${fmt(n)}</td><td class="${lost ? 'neg' : ''}">${lost ? '−' + fmt(lost) : '0'}</td></tr>`;
  let mine = 0, theirs = 0;
  const myRows = r.atk.filter(a => a.key !== 'hero').map(a => { const l = Math.min(a.n, Math.round(a.n * r.attLoss)); mine += l * a.att; const u = U(a.key); return lossRow(u.icon, u.name, a.n, l); }).join('');
  const thRows = r.def.map(d => { const b = Math.round(d.n), l = Math.max(0, b - Math.round(d.n * (1 - r.defLoss))); theirs += l; return lossRow(FOES[d.key].icon, FOES[d.key].name, b, l); }).join('');
  let html = `<div class="odds">${ODDS[r.odds]}</div>
    <div class="bstats"><div><small>Your offense</small><b>⚔️ ${fmt(r.A)}</b><small>${ab ? `matchups ${ab > 0 ? '+' : ''}${ab}%` : 'no matchup bonus'}${r.attMult > 1.001 ? ` · Lord/buffs +${Math.round((r.attMult - 1) * 100)}%` : ''}</small></div>
    <div><small>Enemy defense</small><b>🛡️ ${fmt(r.D)}</b><small>wall ${r.effWall}${r.drop ? ` (−${r.drop} breached)` : ''}${dbn ? ` · matchups +${dbn}%` : ''}</small></div></div>
    <div class="small" style="margin:6px 0">☠️ You lose <b>${Math.round(r.attLoss * 100)}%</b> · they lose <b>${Math.round(r.defLoss * 100)}%</b>${m.mode === 'raid' ? ` · 🎒 survivors carry ${fmt(r.survCarry)}${t.real ? ` (lootable ${fmt(t.loot)})` : ''}` : r.attWin ? ' · the defenders are wiped out' : ''}</div>
    <table class="rt"><tr><th>Yours</th><th>Sent</th><th>Lost</th></tr>${myRows}</table>
    <table class="rt" style="margin-top:6px"><tr><th>Theirs</th><th>Count</th><th>Lost</th></tr>${thRows || '<tr><td colspan="3" class="muted">Unguarded</td></tr>'}</table>
    ${matchNoteHTML(r, 'atk')}`;
  const tips = simAdvice(r, t, m);
  if (tips.length) html += `<div class="small" style="margin-top:8px">💡 ${tips.join('<br>💡 ')}</div>`;
  if (t.real) {
    const short = UNITS[S.faction].some(u => (m.units[u.id] || 0) > (c.troops[u.id] || 0));
    html += `<button class="btn full" style="margin-top:8px" onclick="simSend()">${m.mode === 'raid' ? '🏹' : '⚔️'} Use this army${short ? ' (capped to home troops)' : ''}</button>`;
  }
  el.innerHTML = html;
}

/* ----- Endgame & campaign record ----- */
function liveChampion() { return S.end && S.end.champId ? S.setts.find(s => s.id === S.end.champId && !s.dead) : null; }
function startEndgame() {
  const order = ['khorne', 'nurgle', 'tzeentch', 'slaanesh'];
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  S.end = { order, stage: 0, nextG: gameHours() + 48, champId: null, slain: [], done: false };
}
function endgameStatusTxt() {
  const E = S.end;
  if (!E) return '';
  if (E.done) return '🌅 Archaon slain — the world is saved';
  const c = liveChampion();
  if (c) return `${CHAMPS[c.champ].icon} ${c.name} at (${c.x}|${c.y}) · ${E.slain.length}/5 slain`;
  return `Next Champion in ${fmtDur(g2r(Math.max(0, E.nextG - gameHours()) * 3600))} · ${E.slain.length}/5 slain`;
}
function champLevel(stage) {
  const adj = { easy: -3, normal: 0, hard: 3, brutal: 6 }[S.diff.preset] || 0;
  return Math.min(50, (stage >= 4 ? 44 : 28 + 3 * stage) + adj);
}
function spawnChampion() {
  const E = S.end, key = E.stage >= 4 ? 'archaon' : E.order[E.stage];
  const cit = S.setts.find(s => s.kind === 'citadel');
  let p = cit ? spotNear(cit.x, cit.y, 2, 6) : null;
  if (!p) p = spot((x, y) => y >= 16 && ['wastes', 'norsca', 'kislev'].includes(regionAt(x, y).id), 8);
  if (!p) p = spot(() => true, 8);
  if (!p) { E.nextG = gameHours() + 6; return; }
  const C = CHAMPS[key];
  const s = { id: S.nextId++, fac: 'chaos', kind: 'champion', champ: key, name: C.name, x: p[0], y: p[1], base: champLevel(E.stage), bonus: 0, gx: 0, stunG: 0, hitG: -1e9, dead: false, respawnG: null, army: {}, res: {} };
  S.setts.push(s);
  s.army = settArmy(s);
  RES.forEach(r => { s.res[r] = 3000 * settLvl(s); });
  E.champId = s.id;
  addReport('alert', `${C.icon} ${C.title} has risen!`, `<b>${esc(C.name)}</b> (Lv ${settLvl(s)}) has torn into the world at (${s.x}|${s.y}).<br>${C.trait}<br>${key === 'archaon' ? 'This is the final battle. Slay the Everchosen to save the Old World.' : 'Win an Assault against his lair to banish him.'}`, S.time);
  toast(`${C.icon} ${C.title} has risen!`, 'bad');
}
function slayChampion(s) {
  const E = S.end, key = s.champ;
  S.setts = S.setts.filter(x => x.id !== s.id);
  if (E) {

  const col = st.key === 'greenskins' ? st.wood : st.key === 'elves' ? st.wall : st.stone;
  const edges = [

  edges.forEach(e => {
    for (let s = -R + seg / 2; s < R; s += seg) {

  }

}

function fieldsSceneSVG(c) {

const ADV_KINDS = {
