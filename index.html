/* ----- adventure spawning ----- */
function advSpot() {
  for (let i = 0; i < 3000; i++) {
    const c = pick(S.cities);
    const x = Math.round(c.x + rand(-14, 14)), y = Math.round(c.y + rand(-14, 14));
    if (!inMap(x, y) || terrAt(x, y) === 'sea') continue;
    const d = Math.hypot(x - c.x, y - c.y);
    if (d < 3 || d > 15) continue;
    if (S.cities.some(cc => Math.abs(cc.x - x) <= 1 && Math.abs(cc.y - y) <= 1)) continue;
    if (S.setts.some(s => !s.dead && Math.abs(s.x - x) <= 1 && Math.abs(s.y - y) <= 1)) continue;
    if (S.adventures.some(a => a.x === x && a.y === y)) continue;
    return [x, y];
  }
  return null;
}
function spawnAdventure(gh) {
  const p = advSpot();
  if (!p) return;
  const kind = pick(Object.keys(ADV_KINDS));
  const day = gh / 24;
  const diff = clamp(1 + Math.floor(Math.random() * (1.5 + day / 6)), 1, 5);
  S.adventures.push({ id: S.nextId++, kind, name: pick(ADV_KINDS[kind].names), x: p[0], y: p[1], diff, expG: gh + rand(48, 72) });
}
function advTick(gh) {
  S.adventures = S.adventures.filter(a => a.expG > gh || S.marches.some(m => m.advId === a.id));
  let guard = 0;
  while (gh >= S.nextAdvG && guard++ < 30) {
    S.nextAdvG += rand(5, 8);
    if (S.adventures.length < 4 + S.cities.length) spawnAdventure(gh);
  }
}
function starsTxt(d) { return '★'.repeat(d) + '☆'.repeat(5 - d); }
function advReady(h) { return h && heroStatus(h) === 'home' && !h.wounded; }
function openAdventure(id) {
  const a = S.adventures.find(x => x.id === id);
  if (!a) return;
  UI.sel = { x: a.x, y: a.y };
  if (!UI.advHero || !advReady(heroById(UI.advHero))) { const h = S.heroes.find(advReady); UI.advHero = h ? h.id : null; }
  openModal(advSheet);
}
function advSheet() {
  const a = S.adventures.find(x => x.id === UI.target2);
  return a ? advSheetFor(a) : '<div class="note">The trail has gone cold.</div>';
}
function advSheetFor(a) {
  const K = ADV_KINDS[a.kind];
  let h = `<div class="grab"></div><div class="shead"><div class="qicon" style="border-color:var(--gold)">${K.icon}</div><div><h3 style="margin:0">${esc(a.name)}</h3>
    <div class="desc">Adventure · ${esc(regionAt(a.x, a.y).name)} (${a.x}|${a.y})<br><span style="color:var(--gold2)">${starsTxt(a.diff)}</span> danger · fades in ${fmtDur(g2r((a.expG - gameHours()) * 3600))}</div></div><button class="hbtn x" onclick="closeModal()">✕</button></div>`;
  h += `<div class="note">Only a Lord may go, alone. Expect wounds from the dangers within. Rewards: XP, and a chance of resources, recruits, Renown or a <b>magic item</b> (rarer with higher danger).</div>`;
  const taken = S.marches.find(m => m.advId === a.id);
  if (taken) return h + `<div class="note good" style="margin-top:8px">${heroById(taken.heroId) ? heroById(taken.heroId).icon + ' ' + esc(heroById(taken.heroId).name) : 'A Lord'} is already on the way.</div>`;
  const ready = S.heroes.filter(advReady);
  if (!ready.length) return h + `<div class="note bad" style="margin-top:8px">No Lord is free. Lords must be home and unwounded.</div>`;
  if (!ready.some(x => x.id === UI.advHero)) UI.advHero = ready[0].id;
  h += `<h4>Choose a Lord</h4><div class="segs">${ready.map(x => `<button class="btn ghost sm ${UI.advHero === x.id ? 'on' : ''}" onclick="UI.advHero=${x.id};refreshModal(true)">${x.icon} ${esc(x.name)} · ${Math.round(x.hp)}%</button>`).join('')}</div>`;
  const hero = heroById(UI.advHero);
  const from = cityById(hero.cityId) || capital();
  const p = pathFrom(from, a.x, a.y);
  const spd = marchSpeed({}, hero);
  const risk = a.diff * 0.17 * 70 * (1 - Math.min(0.45, (hero.level - 1) * 0.025)) * (1 - itemVal0(hero, 'armour'));
  h += `<div class="kv"><span>From ${esc(from.name)}</span><span>⏱️ ${isFinite(p.cost) ? fmtDur(g2r(p.cost / spd * 3600)) + ' each way' : 'no route'}</span></div>
    <div class="kv"><span>Expected wounds</span><span class="${risk >= hero.hp ? 'neg' : ''}">≈ ${Math.round(risk * 0.6)}–${Math.round(risk * 1.3)}% health</span></div>`;
  if (risk * 1.3 >= hero.hp) h += `<div class="muted small neg">⚠️ ${esc(hero.name)} may fall wounded and return empty-handed.</div>`;
  h += `<button class="btn full" ${isFinite(p.cost) ? '' : 'disabled'} onclick="sendAdventure(${a.id})">${hero.icon} Send ${esc(hero.name)}</button>`;
  return h;
}
function openAdv(id) { UI.target2 = id; openAdventure(id); }
function sendAdventure(id) {
  simulate(Date.now());
  const a = S.adventures.find(x => x.id === id);
  const hero = heroById(UI.advHero);
  if (!a || !advReady(hero)) return toast('That Lord cannot go right now', 'bad');
  if (S.marches.some(m => m.advId === a.id)) return toast('Another Lord is already on the way', 'bad');
  const from = cityById(hero.cityId) || capital();
  const p = pathFrom(from, a.x, a.y);
  if (!isFinite(p.cost)) return toast('No route', 'bad');
  const travel = g2r(p.cost / marchSpeed({}, hero) * 3600);
  const now = Date.now();
  S.marches.push({ id: S.nextId++, mode: 'adventure', fromCity: from.id, advId: a.id, tName: a.name, tx: a.x, ty: a.y, units: {}, heroId: hero.id, depart: now, arrive: now + travel, travel, phase: 'out', loot: null, returnAt: null, recalled: false, path: p.path });
  save(); closeModal(); toast(`${hero.icon} ${hero.name} sets out for ${a.name}`); rerender();
}
function resolveAdventure(m, t) {
  const a = S.adventures.find(x => x.id === m.advId);
  const h = heroById(m.heroId);
  S.adventures = S.adventures.filter(x => x.id !== m.advId);
  marchBack(m, t);
  if (!a || !h) { addReport('info', 'The trail went cold', 'Your Lord found nothing but tracks and is heading home.', t); return; }
  const dmg = a.diff * 0.17 * rand(0.6, 1.3) * (1 - Math.min(0.45, (h.level - 1) * 0.025));
  let body = `${h.icon} <b>${esc(h.name)}</b> braved the ${esc(a.name)} (${starsTxt(a.diff)}).`;
  const wound = heroHurt(h, dmg);
  const xp = Math.round(45 * a.diff * rand(0.8, 1.2));
  if (h.wounded) {
    m.heroId = null;
    S.marches = S.marches.filter(x => x.id !== m.id);
    gainXP(h, Math.round(xp / 3));
    addReport('loss', `${h.name} fell at the ${a.name}`, body + wound + `<div class="muted small" style="margin-top:6px">+${Math.round(xp / 3)} XP. Revive your Lord from the Lords tab.</div>`, t);
    return;
  }
  const lv = gainXP(h, xp);
  let rewards = [`⭐ +${xp} XP${lv}`];
  const roll = Math.random();
  if (Math.random() < 0.08 + a.diff * 0.06) {
    const it = genItem(rollRarity(a.diff));
    rewards.push(`${RARITY[it.r].n} item: ${itemChip(it)} (${itemBonusText(it)})`);
    toast(`🎁 ${h.name} found ${it.name}!`, 'good');
  }
  if (roll < 0.45) {
    const loot = {}; RES.forEach(r => { loot[r] = Math.round(a.diff * rand(120, 320)); });
    m.loot = loot;
    rewards.push(`💰 ${resTxt(loot)} (carried home)`);
  } else if (roll < 0.65) {
    const u = UNITS[S.faction].find(x => x.b === 'barracks' && x.req === 1);
    const n = a.diff * 4 + Math.floor(rand(0, 4));
    const c = cityById(m.fromCity) || capital();
    c.troops[u.id] = (c.troops[u.id] || 0) + n;
    rewards.push(`${u.icon} ${n} ${esc(u.name)} joined your cause in ${esc(c.name)}`);
  } else if (roll < 0.8) {
    const rn = Math.round(a.diff * rand(100, 200));
    S.renown += rn;
    rewards.push(`✨ +${rn} Renown`);
  }
  { const gd = Math.round(a.diff * rand(50, 150) * (1 + TB('plunder')) * goldTaper()); addGold(gd); rewards.push(`🪙 +${fmt(gd)} gold`); }
  S.stats.adv = (S.stats.adv || 0) + 1;
  addFight(4);
  addReport('win', `${h.name} returns from the ${a.name}`, body + `<h4>Rewards</h4>` + rewards.map(r => `<div>${r}</div>`).join('') + wound + `<div class="muted small" style="margin-top:6px">${Math.round(h.hp)}% health</div>`, t);
}

const DECREE_H = 12, DECREE_CD = 36, WAAAGH_H = 12;
function fx() { if (!S.fx) S.fx = { fight: 0, waaaghG: 0, decree: null, decreeUntilG: 0, decreeCd: {}, inf: 0 }; return S.fx; }
function aegisActive() { return S.faction === 'elves' && gameHours() < (fx().aegisG || 0); }
function waaaghActive() { return S.faction === 'greenskins' && gameHours() < (fx().waaaghG || 0); }
function decreeActive(id) { return S.faction === 'empire' && fx().decree === id && gameHours() < fx().decreeUntilG; }
function addFight(n) {
  if (S.faction !== 'greenskins' || waaaghActive()) return;
  n *= 0.45;
  const before = fx().fight;
  fx().fight = Math.min(100, fx().fight + n);
  if (before < 100 && fx().fight >= 100) { toast('👹 Fightiness is full — call the WAAAGH!', 'good'); addReport('alert', 'Da boyz are ready for a WAAAGH!', 'Fightiness has reached 100. Open the WAAAGH! panel in the City tab to unleash it.', S.time); }
}
function influenceRate() {
  let lv = 0;
  S.cities.forEach(c => { lv += c.bld.temple + c.bld.residence + c.bld.keep; });
  return 0.25 * S.cities.length + 0.03 * lv;
}
function fxTick(gh) {
  const f = fx();
  if (S.faction === 'greenskins' && !waaaghActive() && f.fight < 100) f.fight = Math.max(0, f.fight - 0.25 * gh);
  if (S.faction === 'elves') f.inf = Math.min(200, f.inf + influenceRate() * gh);
}
function decreeCost() { const v = Math.round(200 + 60 * gameHours() / 24); return [v, v, v, v]; }
function callWaaagh() {
  simulate(Date.now());
  if (S.faction !== 'greenskins' || fx().fight < 100 || waaaghActive()) return;
  const gh = gameHours();
  fx().waaaghG = gh + WAAAGH_H; fx().fight = 0;
  const n = 10 + Math.floor(gameDay() * 1.5);
  S.cities.forEach(c => { c.troops.boyz = (c.troops.boyz || 0) + n; });
  addReport('win', '👹 WAAAGH!', `Da Boss bellows and the greenskins answer! For ${WAAAGH_H} game hours every army fights with <b>+25% offense</b>, and <b>${n} Orc Boyz</b> join each of your cities.`, Date.now());
  toast('👹 WAAAGH! +25% offense!', 'good');
  save(); closeModal(); rerender();
}
function issueDecree(id) {
  simulate(Date.now());
  const f = fx(), gh = gameHours(), c = CUR();
  if (S.faction !== 'empire' || !DECREES[id]) return;
  if (gh < f.decreeUntilG) return toast('Another decree is still in force', 'bad');
  if ((f.decreeCd[id] || 0) > gh) return toast('That decree is on cooldown', 'bad');
  const cost = decreeCost();
  if (!afford(c, cost)) return toast(`Not enough resources in ${c.name}`, 'bad');
  pay(c, cost);
  f.decree = id; f.decreeUntilG = gh + DECREE_H; f.decreeCd[id] = gh + DECREE_H + DECREE_CD;
  addReport('info', `📜 ${DECREES[id].name}`, `By order of the Emperor: ${DECREES[id].desc} for ${DECREE_H} game hours.`, Date.now());
  toast(`${DECREES[id].icon} ${DECREES[id].name} issued`, 'good');
  save(); refreshModal(true); rerender();
}
function useInfluence(id, arg) {
  simulate(Date.now());
  const f = fx(), a = INF_ACTS[id], c = CUR();
  if (S.faction !== 'elves' || !a) return;
  if (f.inf < a.cost) return toast('Not enough Influence', 'bad');
  if (id === 'intrigue') {
    if (!arg || FACS[arg].locked) return toast('Choose a faction', 'bad');
    changeRel(arg, 20, 'intrigue', 'Court intrigue');
  } else if (id === 'tribute') {
    const v = Math.round(800 + 40 * gameHours() / 24);
    refund(c, [v, v, v, v]);
  } else if (id === 'elite') {
    c.troops.master = (c.troops.master || 0) + 10 + Math.floor(gameDay() / 3);
  } else if (id === 'aegis') {
    if (aegisActive()) return toast('The Shield of Saphery already protects you', 'bad');
    f.aegisG = gameHours() + 24;
  } else if (id === 'envoy') {
    if (!arg || FACS[arg].locked || stance(arg) !== 'neutral') return toast('Choose a neutral faction', 'bad');
    changeRel(arg, Math.max(0, 55 - S.rel[arg]), 'envoy', 'Envoys of Ulthuan', 2);
    signTreaty(arg, 'alliance', 'The Envoys of Ulthuan sealed the pact.');
  } else if (id === 'blessing') {
    const w = S.heroes.filter(h => h.wounded);
    if (!w.length) return toast('No Lord is wounded', 'bad');
    w.forEach(h => { h.wounded = false; h.hp = 100; h.reviveAt = null; });
  }
  f.inf -= a.cost;
  addReport('info', `🦢 ${a.name}`, `Influence spent: ${a.cost}. ${a.desc}${id === 'intrigue' ? ' (' + FACS[arg].name + ')' : ''}`, Date.now());
  toast(`${a.icon} ${a.name}`, 'good');
  save(); refreshModal(true); rerender();
}

const PLAN_MAX = 6;
function startBuild(c, kind, id, t) {

  pay(c, u.cost);

}
function planStatus(c, p) {

  if (u.block) {
    if (u.block.startsWith('All ')) return { st: 'wait', txt: 'Waiting for a free builder' };
    if (u.block.startsWith('Already')) return { st: 'wait', txt: 'Waiting for the current upgrade' };
    if (u.block.startsWith('Requires')) return { st: 'wait', txt: u.block };
    return { st: 'stuck', txt: u.block };

function processPlans(t) {

    for (let i = 0; i < c.plan.length && c.queues.length < buildSlots(c) && guard++ < 20; i++) {
      const p = c.plan[i];
      const s = planStatus(c, p);
      if (s.st === 'done') { c.plan.splice(i, 1); i--; continue; }
      if (s.st === 'res') break;          // keep resources for the next item in line
      if (s.st !== 'ready') continue;      // blocked for another reason: let later items go first
      const q = startBuild(c, p.kind, p.id, t);
      if (q) { c.plan.splice(i, 1); i--; toast(`📋 ${cityTag(c)}${q.name} → Lv ${q.to} started from your plan`, 'good'); UI.dirty = true; }
    }

}

function planPanelHTML(c) {
  const plan = c.plan || [];
  if (!plan.length) return `<div class="muted small" style="margin-top:6px">📋 Tip: tap “Add to plan” on any upgrade to queue it. It starts by itself once a builder is free and the resources are in.</div>`;
  const counts = {};
  return `<h4>📋 Planned (${plan.length}/${PLAN_MAX})</h4>` + plan.map((p, i) => {
    const key = p.kind + p.id;
    counts[key] = (counts[key] || 0) + 1;
    const u = upgradeInfo(c, p.kind, p.id);
    const lvl = u.cur + (findBuild(c, p.kind, p.id) ? 1 : 0) + counts[key];
    const s = planStatus(c, p);
    const col = s.st === 'stuck' ? 'neg' : s.st === 'res' ? '' : 'muted';
    return `<div class="kv" style="align-items:center"><span>${i + 1}. ${u.icon} <b>${esc(u.name)}</b> → Lv ${lvl}<br><span class="small ${col}">${esc(s.txt)}</span>${s.st === 'res' && u.cost ? '<br>' + costChips(u.cost) : ''}</span>
      <span class="row" style="gap:4px"><button class="hbtn" style="height:30px;min-width:30px" onclick="movePlan(${p.pid},-1)">↑</button><button class="hbtn" style="height:30px;min-width:30px" onclick="removePlan(${p.pid})">✕</button></span></div>`;
  }).join('');
}

/* =========================================================
   BOOT
   ========================================================= */
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('visibilitychange', () => { if (!S) return; if (document.hidden) save(); else tick(); });
window.addEventListener('pagehide', () => save());
window.addEventListener('resize', () => { UI.lastHdrH = 0; if (UI.tab === 'map') requestDraw(); });

(function boot() {
  let saved = load();
  if (saved && (saved.worldV || 1) < WORLD_V) {
    try { localStorage.setItem('grimfall_oldworld_backup', JSON.stringify(saved)); } catch (e) {}
    try { S = saved; if (S.cities && S.stats) recordCampaign(S.victory ? 'Victory' : 'Unfinished'); } catch (e) {}
    S = null;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    UI.startNotice = '🌍 The world has grown! GrimFall now spans the whole Warhammer world, so your old campaign could not be carried over. It has been recorded in the Hall of Legends — start a new campaign below.';
    saved = null;
  }
  if (saved) {
    S = saved;
    setFacOrder(S.faction);
    if ((S.v || 1) < SAVE_VERSION || !S.cities) migrate();
    else initWorld(false);
    normalizeSave();
    const away = Date.now() - S.time;
    const startId = S.nextId;
    const before = {}; RES.forEach(r => { before[r] = S.cities.reduce((s, c) => s + c.res[r], 0); });
    startApp();
    if (away > 5 * 60000) {
      const news = S.reports.filter(r => r.id >= startId);
      openModal(() => awayHTML(away, news, before));
    }
  } else {
    showStart();
  }
})();

</script>
